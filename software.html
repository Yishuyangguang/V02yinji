<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    
    <!-- 腾讯系防封禁与提示拦截器 -->
    <script>
      (function() {
          var ua = navigator.userAgent.toLowerCase();
          var isTencentApp = ua.indexOf('micromessenger') !== -1 || ua.indexOf('wxwork') !== -1 || ua.indexOf('qq/') !== -1;
          if (isTencentApp) {
              document.write('\
              <div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(248,250,252,0.98);z-index:2147483647;display:flex;flex-direction:column;align-items:center;padding-top:15vh;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,sans-serif;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);touch-action:none;pointer-events:all;overscroll-behavior:none;">\
                  <svg style="position:absolute;top:15px;right:25px;width:70px;height:70px;animation:wechatBounce 1s infinite alternate;" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">\
                      <path d="M85 15 C 60 15, 30 40, 20 80" stroke="#6366f1" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="8 8"/>\
                      <path d="M90 10 L 65 20 L 80 35 Z" fill="#6366f1"/>\
                  </svg>\
                  <h2 style="font-size:1.6rem;color:#6366f1;margin-bottom:20px;letter-spacing:2px;font-weight:bold;">请在浏览器中打开</h2>\
                  <p style="font-size:1.15rem;line-height:2;text-align:center;padding:0 30px;opacity:0.9;">为了呈现完美的沉浸式体验<br>并确保功能正常运作</p>\
                  <div style="background:#ef4444;color:#fff;padding:12px 25px;border-radius:25px;font-weight:bold;margin-top:30px;box-shadow:0 10px 25px rgba(239,68,68,0.3);">点击右上角【···】选择在浏览器打开</div>\
                  <style>@keyframes wechatBounce { 0% { transform:translate(0,0); } 100% { transform:translate(-10px,10px); } }</style>\
              </div>\
              ');
              document.close();
              if(window.stop) window.stop();
          }
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>常用软件与平台 - 恒久印记</title>
    
    <style>
        :root {
            --bg-base: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(230, 230, 230, 0.9);
            --glass-shadow: rgba(0, 0, 0, 0.04);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #6366f1;
            --accent: #f59e0b;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-title: "Songti SC", "SimSun", serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body, html {
            width: 100vw; max-width: 100vw; min-height: 100vh;
            background-color: var(--bg-base); color: var(--text-main);
            font-family: var(--font-main); overflow-x: hidden;
            background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.05), transparent 25%);
        }

        .main-container {
            width: 100%; max-width: 900px; margin: 0 auto;
            padding: calc(env(safe-area-inset-top) + 6vh) 20px calc(env(safe-area-inset-bottom) + 6vh) 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* ================= 🚀 顶部标题区 ================= */
        .header-area {
            text-align: center; margin-bottom: 40px; width: 100%;
        }
        .header-icon {
            font-size: 4.5rem; margin-bottom: 15px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            animation: float 6s ease-in-out infinite; display: inline-block;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .main-title {
            font-size: 2.2rem; font-family: var(--font-title); font-weight: 900;
            color: var(--text-main); letter-spacing: 3px; margin-bottom: 15px;
        }
        .sub-title {
            font-size: 1.05rem; color: var(--text-sub); letter-spacing: 1px;
        }

        /* ================= 🚀 软件列表 3D 卡片容器 ================= */
        .software-panel {
            width: 100%; background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(150%); -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid var(--glass-border); border-radius: 32px;
            padding: 40px 30px; box-shadow: 0 20px 50px var(--glass-shadow), inset 0 2px 5px rgba(255,255,255,1);
            border-top: 4px solid var(--accent); /* 完美还原截图的顶部暖色高亮边 */
            margin-bottom: auto; /* 推开底部按钮 */
        }

        .software-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }

        /* 每一项软件的精美卡片 */
        .software-item {
            display: flex; align-items: center; padding: 20px; border-radius: 20px;
            background: rgba(248, 250, 252, 0.6); border: 1px solid rgba(226, 232, 240, 0.8);
            text-decoration: none; color: inherit; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); cursor: pointer;
        }
        .software-item:hover {
            background: #ffffff; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border-color: #cbd5e1;
        }
        .software-item:active { transform: scale(0.97); }

        .app-icon {
            width: 50px; height: 50px; border-radius: 14px; background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            display: flex; justify-content: center; align-items: center; font-size: 1.8rem;
            margin-right: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); flex-shrink: 0;
        }
        .app-info { flex: 1; overflow: hidden; }
        .app-name { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin-bottom: 5px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .app-desc { font-size: 0.9rem; color: var(--text-sub); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }

        /* ================= 🚀 极致美学：退出按钮自适应样式 ================= */
        .btn-exit-wrapper {
            width: 100%; display: flex; justify-content: center; margin-top: 40px; flex-shrink: 0;
        }
        
        .btn-exit-software {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 16px 55px;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.04);
            display: flex; justify-content: center; align-items: center;
        }
        .btn-exit-software:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }
        .btn-exit-software:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .main-container { padding: calc(env(safe-area-inset-top) + 20px) 15px calc(env(safe-area-inset-bottom) + 20px) 15px; }
            .software-panel { padding: 30px 20px; border-radius: 24px; }
            .header-icon { font-size: 3.5rem; }
            .main-title { font-size: 1.8rem; }
            .software-grid { grid-template-columns: 1fr; }
            .btn-exit-software { width: 85%; max-width: 260px; padding: 14px; font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- 头部视觉区 -->
        <div class="header-area">
            <div class="header-icon">💻</div>
            <h1 class="main-title">常用软件与平台</h1>
            <p class="sub-title">恒久印记精选 · 点击即可直达官方进行下载与阅览</p>
        </div>

        <!-- 软件列表 3D 面板 -->
        <div class="software-panel">
            <div class="software-grid">
                
                <!-- 预置的卡片 1 -->
                <a href="https://github.com" class="software-item" target="_blank">
                    <div class="app-icon">🚀</div>
                    <div class="app-info">
                        <div class="app-name">Shadowrocket</div>
                        <div class="app-desc">高性能网络代理工具</div>
                    </div>
                </a>

                <!-- 预置的卡片 2 -->
                <a href="https://dash.cloudflare.com" class="software-item" target="_blank">
                    <div class="app-icon">🌐</div>
                    <div class="app-info">
                        <div class="app-name">Cloudflare</div>
                        <div class="app-desc">全球顶级的域名解析与安全防护</div>
                    </div>
                </a>
                
                <!-- 预置的卡片 3 -->
                <a href="https://2.taobao.com" class="software-item" target="_blank">
                    <div class="app-icon">🛒</div>
                    <div class="app-info">
                        <div class="app-name">闲鱼数字平台</div>
                        <div class="app-desc">官方数字资产专营店</div>
                    </div>
                </a>
                
                <!-- 预置的卡片 4 -->
                <a href="https://www.spaceship.com" class="software-item" target="_blank">
                    <div class="app-icon">🛸</div>
                    <div class="app-info">
                        <div class="app-name">Spaceship</div>
                        <div class="app-desc">极速域名注册控制台</div>
                    </div>
                </a>

                <!-- 如果你有更多的软件，可以继续往下复制 <a class="software-item">...</a> -->

            </div>
        </div>

        <!-- 🚀 核心：退出销毁按钮 -->
        <div class="btn-exit-wrapper">
            <button class="btn-exit-software" onclick="closeSoftwarePage()">退 出</button>
        </div>

    </div>

    <!-- 🚀 跨生态页面物理销毁引擎 -->
    <script>
        function closeSoftwarePage() {
            // 场景 1：如果你未来把这个页面也做成了 iframe 内嵌，这段代码会通过 postMessage 通知母体隐藏它
            if (window !== window.parent) {
                window.parent.postMessage('hide_player', '*'); 
            } 
            // 场景 2：标准新标签页（_blank）模式打开
            else {
                // 切断页面来源关联，并触发浏览器的物理关闭机制
                window.opener = null;
                window.open('', '_self');
                window.close();
                
                // 兜底防御机制：由于部分苹果 iOS Safari / 微信浏览器的极致安全策略，可能会拦截 JS 自动关闭当前网页的行为
                // 如果 0.3 秒后检测到网页还没被成功关掉，说明被安全策略拦截了，温和地提示用户手动点击浏览器自带的返回
                setTimeout(() => {
                    if (!document.hidden) {
                        alert("安全拦截：请直接点击屏幕左上角的【返回/关闭】按钮，即可无缝回到已登录的印记主页。");
                    }
                }, 300);
            }
        }
    </script>
</body>
</html>
