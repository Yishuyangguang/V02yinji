<iframe id="yinji-player-iframe" allow="autoplay" style="display:none; opacity:0; transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:2147483646; border:none; background:transparent;"></iframe>

<!-- 新增软件导航专属隐形层 -->
<iframe id="yinji-software-iframe" allow="autoplay" style="display:none; opacity:0; transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:2147483647; border:none; background:transparent;"></iframe>

<script>
    // 🚀 终极防护：拦截所有内部页面的跳转，强制吸入 Iframe
    const originalWindowOpen = window.open;
    window.open = function(url, target, features) {
        if (!url) return originalWindowOpen.apply(this, arguments);
        
        // 1. 拦截音律播放器
        if (url.includes('music-player.html')) {
            const iframe = document.getElementById('yinji-player-iframe');
            if (!iframe.src || iframe.src !== url) iframe.src = url;
            iframe.style.display = 'block';
            setTimeout(() => iframe.style.opacity = '1', 10);
            return null;
        }
        
        // 2. 拦截所有本地内部 HTML（比如你配置的软件导航页、个人中心页等）
        const isInternalHtml = url.includes('.html') && (!url.startsWith('http') || url.includes(window.location.hostname));
        
        if (isInternalHtml) {
            const iframe = document.getElementById('yinji-software-iframe');
            if (!iframe.src || iframe.src !== url) iframe.src = url;
            iframe.style.display = 'block';
            setTimeout(() => iframe.style.opacity = '1', 10);
            return null;
        }
        
        // 3. 其他真实的外部链接正常打开新标签页
        return originalWindowOpen.apply(this, arguments);
    };

    // 接收来自隐身子页面的指令
    window.addEventListener('message', function(e) {
        if (e.data === 'hide_player') {
            const iframe = document.getElementById('yinji-player-iframe');
            iframe.style.opacity = '0';
            setTimeout(() => iframe.style.display = 'none', 400); 
        } else if (e.data === 'hide_software') {
            const iframe = document.getElementById('yinji-software-iframe');
            iframe.style.opacity = '0';
            setTimeout(() => iframe.style.display = 'none', 400); 
        } else if (e.data && e.data.type === 'player_state') {
            const floatBox = document.getElementById('apple-music-box');
            if (floatBox) {
                if (e.data.playing) floatBox.classList.add('playing');
                else floatBox.classList.remove('playing');
            }
        }
    });

    const checkLogoutInterval = setInterval(() => {
        if (typeof window.logout === 'function' && !window.logout.isPatchedForPlayer) {
            const origLogout = window.logout;
            window.logout = function() {
                const pIframe = document.getElementById('yinji-player-iframe');
                if (pIframe) { pIframe.src = ''; pIframe.style.display = 'none'; }
                
                const sIframe = document.getElementById('yinji-software-iframe');
                if (sIframe) { sIframe.src = ''; sIframe.style.display = 'none'; }
                
                const floatBox = document.getElementById('apple-music-box');
                if (floatBox) floatBox.classList.remove('playing');
                origLogout.apply(this, arguments);
            };
            window.logout.isPatchedForPlayer = true;
            clearInterval(checkLogoutInterval);
        }
    }, 100);
</script>

<script>
    let pressTimer = null;
    
    window.handleStartPress = function(e) {
        if (e && e.type === 'touchstart') e.preventDefault(); 
        
        const area = document.getElementById('btn-long-press');
        if (!area) return;

        area.classList.add('pressing');
        
        if (pressTimer) clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
            area.classList.add('filled');
            setTimeout(() => {
                area.classList.remove('pressing', 'filled');
                if(typeof window.completeAction === 'function') window.completeAction();
            }, 150); 
        }, 1500); 
    };

    window.handleEndPress = function(e) {
        if (e && e.type === 'touchend') e.preventDefault();
        
        const area = document.getElementById('btn-long-press');
        if (area) {
            area.classList.remove('pressing');
            area.classList.remove('filled');
        }
        
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }
    };
</script>

                                db.stages[state.stage].categories.splice(idx, 1);
                                
                                if (state.activeCategoryId === cat.id) {
                                    state.activeCategoryId = db.stages[state.stage].categories.length > 0 ? db.stages[state.stage].categories[0].id : '';
                                }
                                
                                window.showGlobalToast('正在删除...', 'loading');
                                await window.saveDB();
                                window.renderCardList();
                                window.showGlobalToast('✅ 删除成功', 'success');
                            };
                            
                            tab.appendChild(ipt);
                            tab.appendChild(delBtn);
                        } else {
                            tab.innerText = cat.name;
                        }
                        
                        tab.onclick = () => {
                            if (!state.isEditMode) {
                                state.activeCategoryId = cat.id;
                                window.renderCardList();
                            }
                        };
                        
                        if(tabContainer) tabContainer.appendChild(tab);
                    });
                }
                
                if (state.isEditMode) {
                    const addBtn = document.createElement('div');
                    addBtn.className = 'btn-add-cat-inline';
                    addBtn.innerHTML = '<span style="font-size:18px; margin-right:4px;">+</span> 新增模块';
                    addBtn.onclick = async () => {
                        if (!db.stages[state.stage].categories) db.stages[state.stage].categories = [];
                        const newId = 'cat_' + Date.now();
                        db.stages[state.stage].categories.push({ id: newId, name: '新模块', articles: [] });
                        state.activeCategoryId = newId; 
                        
                        window.showGlobalToast('正在创建...', 'loading');
                        await window.saveDB();
                        window.renderCardList();
                        window.showGlobalToast('✅ 创建成功，请直接点击名称修改', 'success');
                    };
                    if(tabContainer) tabContainer.appendChild(addBtn);
                }

                const container = document.getElementById('card-list-container');
                if(container) container.innerHTML = '';
                const activeCards = db.stages[state.stage].cards.filter(c => c.categoryId === state.activeCategoryId);

                if (activeCards.length > 0 || state.isEditMode) {
                    const grid = document.createElement('div');
                    grid.className = 'content-grid';

                    let userCompleted = [];
                    if (typeof currentUserAccount !== 'undefined' && currentUserAccount && db.users[currentUserAccount]) {
                        if (!db.users[currentUserAccount].completedCards) db.users[currentUserAccount].completedCards = [];
                        userCompleted = db.users[currentUserAccount].completedCards;
                    }

                    activeCards.forEach((card) => {
                        const cardDiv = document.createElement('div');
                        cardDiv.className = 'data-card';
                        
                        let badgeHtml = '';
                        if (!userCompleted.includes(card.id) && !state.isEditMode) {
                            badgeHtml = `<div class="card-new-badge">NEW</div>`;
                        }

                        cardDiv.innerHTML = `${badgeHtml}<h3 class="card-inner-title">${card.title}</h3>`;
                        
                        if (state.isEditMode) {
                            const globalIndex = db.stages[state.stage].cards.findIndex(c => c.id === card.id);
                            const actDiv = document.createElement('div');
                            actDiv.className = 'card-edit-badge';
                            actDiv.innerHTML = `<div class="action-icon" onclick="event.stopPropagation(); window.openEditModal(${globalIndex})">✎</div><div class="action-icon del" onclick="event.stopPropagation(); window.deleteCard(${globalIndex})">✖</div>`;
                            cardDiv.appendChild(actDiv);
                        }
                        cardDiv.onclick = () => { if(!state.isEditMode && typeof window.startCardFlow === 'function') window.startCardFlow(card); };
                        grid.appendChild(cardDiv);
                    });
                    
                    if (activeCards.length === 0 && state.isEditMode) { 
                        grid.innerHTML = `<p style="opacity:0.4; font-size:0.85rem; text-align:center; width:100%; grid-column: 1 / -1; padding: 20px;">该模块暂无内容，请点击上方 [+ 新增卡片]</p>`; 
                    }
                    
                    const section = document.createElement('div');
                    section.className = 'module-section';
                    section.appendChild(grid);
                    if(container) container.appendChild(section);
                } else {
                    if(container) container.innerHTML = '<p style="opacity:0.4; margin-top:50px; text-align:center; font-size: 1.1rem; font-weight: bold;">当前模块暂无内容</p>';
                }
            };
            
            originalPatched = true;
            clearInterval(checkPatch);
            
            if(document.getElementById('screen-card-list') && document.getElementById('screen-card-list').classList.contains('active')) {
                window.renderCardList();
            }
        }
    }, 50);

    let stepEnginePatched = false;
    const checkStepPatch = setInterval(() => {
        if (typeof window.renderContentStep === 'function' && !stepEnginePatched) {
            
            const originalStartCardFlow = window.startCardFlow;
            window.startCardFlow = function(card) {
                if (card && card.steps && card.steps.length === 3) {
                    card.steps.unshift({title: '参考经文', text: ''});
                }
                if (typeof originalStartCardFlow === 'function') {
                    originalStartCardFlow.call(this, card);
                } else {
                    state.currentCard = card; 
                    const prepTextEl = document.getElementById('prep-text');
                    if(prepTextEl) prepTextEl.innerText = db.stages[state.stage].prepText; 
                    
                    const prepBtn = document.getElementById('btn-prep-confirm'); 
                    if(prepBtn) {
                        if (state.stage === '单身期') prepBtn.innerText = '我已准备好'; 
                        else prepBtn.innerText = '我们已预备好'; 
                    }
                    window.navigateTo('screen-prep'); 
                }
            };

            window.renderContentStep = function() {
                const stepData = state.currentCard.steps[state.currentStep];
                if(!stepData) return;

                const titleEl = document.getElementById('content-type-title');
                if(titleEl) {
                    titleEl.innerText = `【${db.stages[state.stage].categories.find(c => c.id === state.currentCard.categoryId)?.name || '印记'}】的连结`;
                }

                const stepTitle = document.getElementById('step-title');
                if(stepTitle) {
                    stepTitle.innerText = stepData.title || '';
                    stepTitle.style.animation = 'none';
                    void stepTitle.offsetWidth; 
                    stepTitle.style.animation = '';
                }

                const stepText = document.getElementById('step-text');
                if(stepText) {
                    stepText.innerHTML = (stepData.text || '').replace(/\n/g, '<br><br>');
                    stepText.style.animation = 'none';
                    void stepText.offsetWidth;
                    stepText.style.animation = '';
                }

                for(let i=1; i<=4; i++) {
                    const dot = document.getElementById(`dot-${i}`);
                    if(dot) {
                        if (i - 1 === state.currentStep) dot.classList.add('active');
                        else dot.classList.remove('active');
                    }
                }

                const nextBtn = document.getElementById('btn-next-step');
                const longPressBtn = document.getElementById('btn-long-press');

                if (state.currentStep < 3) { 
                    if(nextBtn) nextBtn.style.display = 'flex';
                    if(longPressBtn) longPressBtn.style.display = 'none';
                } else { 
                    if(nextBtn) nextBtn.style.display = 'none';
                    if(longPressBtn) longPressBtn.style.display = 'flex';
                }
            };

            window.nextContentStep = function() {
                if (state.currentStep < 3) {
                    state.currentStep++;
                    const t = document.getElementById('step-title');
                    const p = document.getElementById('step-text');

                    if(t) t.style.opacity = 0;
                    if(p) p.style.opacity = 0;

                    setTimeout(() => {
                        window.renderContentStep();
                        if(t) { t.style.transition = 'opacity 0.5s'; t.style.opacity = 1; }
                        if(p) { p.style.transition = 'opacity 0.5s'; p.style.opacity = 1; }
                    }, 300);
                }
            };

            window.openEditModal = function(index) {
                const isNew = (index === null);
                const titleEl = document.getElementById('modal-title');
                if(titleEl) titleEl.innerText = isNew ? '新增卡片' : '编辑卡片';

                const catSelect = document.getElementById('edit-card-category');
                if(catSelect) catSelect.innerHTML = '';
                const cats = db.stages[state.stage].categories || [];
                cats.forEach(c => {
                    if(catSelect) catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });

                let c = isNew ? {
                    id: 'c_'+Date.now(),
                    categoryId: state.activeCategoryId,
                    title:'',
                    steps:[
                        {title:'参考经文', text:''},
                        {title:'认知', text:''},
                        {title:'操练', text:''},
                        {title:'宣告', text:''}
                    ]
                } : db.stages[state.stage].cards[index];

                if (c.steps && c.steps.length === 3) {
                    c.steps.unshift({title: '参考经文', text: ''});
                }

                document.getElementById('edit-card-id').value = index === null ? 'new' : index;
                document.getElementById('edit-card-category').value = c.categoryId || (cats[0]?cats[0].id:'');
                document.getElementById('edit-card-title').value = c.title;

                for(let i=1; i<=4; i++) {
                    const sTitle = document.getElementById(`edit-s${i}-title`);
                    const sText = document.getElementById(`edit-s${i}-text`);
                    if(sTitle) sTitle.value = c.steps[i-1] ? c.steps[i-1].title : '';
                    if(sText) sText.value = c.steps[i-1] ? c.steps[i-1].text : '';
                }

                if(typeof window.showModal === 'function') window.showModal('edit-modal');
            };

            window.saveCard = async function() {
                const idxStr = document.getElementById('edit-card-id').value;
                const c = {
                    id: idxStr === 'new' ? 'c_' + Date.now() : db.stages[state.stage].cards[parseInt(idxStr)].id,
                    categoryId: document.getElementById('edit-card-category').value,
                    title: document.getElementById('edit-card-title').value || '未命名',
                    steps: []
                };

                for(let i=1; i<=4; i++) {
                    c.steps.push({
                        title: document.getElementById(`edit-s${i}-title`).value,
                        text: document.getElementById(`edit-s${i}-text`).value
                    });
                }

                if(idxStr === 'new') {
                    db.stages[state.stage].cards.push(c);
                } else {
                    db.stages[state.stage].cards[parseInt(idxStr)] = c;
                }

                if(typeof window.saveDB === 'function') await window.saveDB();
                if(typeof window.hideModal === 'function') window.hideModal('edit-modal');
                if(typeof window.renderCardList === 'function') window.renderCardList();
            };

            stepEnginePatched = true;
            clearInterval(checkStepPatch);
        }
    }, 50);
</script>

<script>
    (function() {
        var autoVersion = new Date().getTime(); 
        var scripts = [
            'auth-sync-engine.js',
            'app.js',
            'stage-layout.js',
            'card-tracker.js',
            'card-purifier.js',
            'counseling-doc.js',
            'card-review.js'
        ];
        scripts.forEach(function(src) {
            var script = document.createElement('script');
            script.src = src + '?v=' + autoVersion;
            script.async = false; 
            document.body.appendChild(script);
        });
    })();
</script>
</body>
