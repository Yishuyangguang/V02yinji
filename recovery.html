<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恒久印记 - 云端密码调度台</title>
    <style>
        :root {
            --theme-bg-color: #1c1d22;
            --theme-primary: #d4af37;
            --theme-text: #ffffff;
            --theme-glass-bg: rgba(42, 43, 48, 0.7);
            --theme-glass-border: rgba(255, 255, 255, 0.08);
            --theme-input-bg: rgba(0, 0, 0, 0.3);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-title: "Songti SC", "SimSun", serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: var(--theme-bg-color); color: var(--theme-text); font-family: var(--font-main); overflow: hidden; display: flex; justify-content: center; align-items: center; }

        #bg-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top center, #ebd373 0%, var(--theme-bg-color) 80%); opacity: 0.12; z-index: 1; pointer-events: none; }

        .container { position: relative; z-index: 10; width: 90%; max-width: 500px; }

        .glass-panel {
            background: var(--theme-glass-bg); backdrop-filter: blur(35px) saturate(150%); -webkit-backdrop-filter: blur(35px) saturate(150%);
            border: 1px solid var(--theme-glass-border); border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.05);
            padding: 3rem 2rem; width: 100%; text-align: center;
        }

        h1 { font-family: var(--font-title); font-size: 2.2rem; margin-bottom: 0.5rem; letter-spacing: 2px; }
        p { opacity: 0.7; margin-bottom: 2rem; font-size: 0.95rem; }

        input { width: 100%; background: var(--theme-input-bg); border: 1px solid var(--theme-glass-border); color: var(--theme-text); padding: 16px 20px; border-radius: 18px; margin-bottom: 18px; font-size: 1.05rem; outline: none; transition: border 0.3s; }
        input:focus { border-color: #6366f1; }

        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); border: none; color: #fff; padding: 1rem 2.5rem; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: all 0.3s; width: 100%; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); margin-bottom: 20px; }
        .btn-primary:active { transform: scale(0.97); }

        .result-box {
            display: none; flex-direction: column; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 20px; text-align: left; margin-top: 10px;
        }
        .result-item { margin-bottom: 10px; font-size: 1rem; }
        .result-label { opacity: 0.6; font-size: 0.85rem; display: block; margin-bottom: 4px; }
        .result-value { font-weight: bold; color: var(--theme-primary); font-size: 1.2rem; word-break: break-all; }
        .result-value.pwd { color: #10b981; letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="bg-gradient"></div>

<div class="container">
    <div class="glass-panel">
        <h1>印记密码找回</h1>
        <p>连接云端数据库，极速检索用户凭证</p>
        
        <input type="text" id="search-input" placeholder="请输入注册账号或自定义昵称" autocomplete="off">
        <button class="btn-primary" onclick="searchPassword()">云 端 检 索</button>

        <div class="result-box" id="result-box">
            <div class="result-item">
                <span class="result-label">原生注册账号</span>
                <span class="result-value" id="res-account">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">绑定的自定义昵称</span>
                <span class="result-value" style="color: #60a5fa;" id="res-nickname">-</span>
            </div>
            <div class="result-item" style="margin-bottom:0;">
                <span class="result-label">最新安全密码</span>
                <span class="result-value pwd" id="res-password">-</span>
            </div>
        </div>
        
        <p id="error-msg" style="color: #ef4444; margin-top: 15px; display: none; margin-bottom: 0;">未在云端找到该账号或昵称</p>
    </div>
</div>

<script>
    async function searchPassword() {
        const query = document.getElementById('search-input').value.trim();
        const resultBox = document.getElementById('result-box');
        const errorMsg = document.getElementById('error-msg');
        
        if(!query) {
            alert('请输入要查询的账号或昵称'); return;
        }

        try {
            const res = await fetch('/api/db');
            if(!res.ok) throw new Error();
            const db = await res.json();
            const users = db.users || {};

            let foundAccount = null;
            let foundData = null;

            for (let key in users) {
                if (key === query || (users[key].nickname && users[key].nickname === query)) {
                    foundAccount = key;
                    foundData = users[key];
                    break;
                }
            }

            if (foundAccount && foundData) {
                const password = typeof foundData === 'string' ? foundData : foundData.password;
                const nickname = typeof foundData === 'string' ? '无' : (foundData.nickname || '无');

                document.getElementById('res-account').innerText = foundAccount;
                document.getElementById('res-nickname').innerText = nickname;
                document.getElementById('res-password').innerText = password;
                
                errorMsg.style.display = 'none';
                resultBox.style.display = 'flex';
            } else {
                resultBox.style.display = 'none';
                errorMsg.style.display = 'block';
            }

        } catch (e) {
            alert('无法连接至云端数据库，请检查网络或部署状态。');
        }
    }
</script>

</body>
</html>
