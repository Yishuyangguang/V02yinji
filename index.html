<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>印记 - Seal of Love</title>
    <style>
        /* ================= 全局重置与变量 ================= */
        :root {
            --theme-bg: #fdfbf7;
            --theme-text: #2c2c2c;
            --theme-primary: #d4af37; /* 默认金 */
            --theme-shadow-light: #ffffff;
            --theme-shadow-dark: #e6e4d9;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            --font-title: "Songti SC", "SimSun", serif; /* 衬线体增加神圣感 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 防止长按选中文本 */
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 绝对禁止屏幕外溢 */
            background-color: var(--theme-bg);
            color: var(--theme-text);
            font-family: var(--font-main);
            transition: background-color 0.8s ease, color 0.8s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ================= 核心容器 ================= */
        #app-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            text-align: center;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s ease;
            transform: translateY(20px);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
            z-index: 10;
        }

        /* ================= 排版与字体 ================= */
        h1 {
            font-family: var(--font-title);
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            margin-bottom: 1rem;
            color: var(--theme-primary);
            line-height: 1.3;
            letter-spacing: 2px;
        }

        p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            line-height: 1.8;
            margin-bottom: 1.5rem;
            text-align: justify;
            text-align-last: center; /* 保证对称美感 */
        }

        .bible-verse {
            font-family: var(--font-title);
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            color: #777;
            margin-bottom: 2rem;
            font-style: italic;
        }

        /* ================= 高级 3D 按钮 (新拟态) ================= */
        .btn-3d {
            background: var(--theme-bg);
            color: var(--theme-text);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 6px 6px 12px var(--theme-shadow-dark),
                       -6px -6px 12px var(--theme-shadow-light);
            cursor: pointer;
            transition: all 0.2s ease;
            width: 80%;
            max-width: 300px;
            margin: 0.8rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 1px;
        }

        .btn-3d:active {
            box-shadow: inset 6px 6px 12px var(--theme-shadow-dark),
                        inset -6px -6px 12px var(--theme-shadow-light);
            transform: scale(0.97);
            color: var(--theme-primary);
        }

        .btn-primary {
            background: var(--theme-primary);
            color: #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .btn-primary:active {
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        /* ================= 进度指示器 ================= */
        .progress-bar {
            position: absolute;
            top: 2rem;
            display: flex;
            gap: 10px;
            width: 80%;
            justify-content: center;
        }
        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--theme-shadow-dark);
            transition: all 0.4s ease;
        }
        .progress-dot.active {
            background-color: var(--theme-primary);
            transform: scale(1.3);
        }

        /* ================= 合并动画模块 ================= */
        .sync-container {
            width: 100%;
            height: 250px;
            position: relative;
            margin-bottom: 2rem;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: inset 4px 4px 10px var(--theme-shadow-dark), inset -4px -4px 10px var(--theme-shadow-light);
            background: #fff;
        }

        .sync-half {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); /* Q弹的高级合并感 */
        }
        
        /* 男生手机显示左边，初始靠左外侧，合并时移到中心 */
        .sync-half.boy {
            left: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400"><rect width="200" height="400" fill="%23a8c0ff"/><text x="100" y="200" font-size="24" text-anchor="middle" fill="white">男方印记</text></svg>');
            transform: translateX(-50px);
            opacity: 0.5;
        }
        
        /* 女生手机显示右边，初始靠右外侧，合并时移到中心 */
        .sync-half.girl {
            right: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400"><rect width="200" height="400" fill="%23ffafbd"/><text x="100" y="200" font-size="24" text-anchor="middle" fill="white">女方印记</text></svg>');
            transform: translateX(50px);
            opacity: 0.5;
        }

        .sync-container.merged .boy { transform: translateX(0); opacity: 1; }
        .sync-container.merged .girl { transform: translateX(0); opacity: 1; }

        /* ================= 长按进度条 (同心宣告) ================= */
        .long-press-area {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--theme-bg);
            box-shadow: 8px 8px 16px var(--theme-shadow-dark),
                       -8px -8px 16px var(--theme-shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2rem auto;
            cursor: pointer;
            overflow: hidden;
        }
        
        .press-text {
            font-weight: bold;
            color: var(--theme-primary);
            z-index: 2;
            font-size: 0.9rem;
        }

        .press-fill {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 0%;
            background: var(--theme-primary);
            opacity: 0.2;
            transition: height 0.1s linear;
            z-index: 1;
        }

    </style>
</head>
<body>

<div id="app-container">

    <!-- 预加载音频 (指向您的 R2 存储桶直链) -->
    <audio id="bgm-player" loop preload="auto">
        <!-- 示例静音/白噪音链接，请替换为真实R2链接 -->
        <source src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3" type="audio/mpeg">
    </audio>

    <!-- 1. 欢迎与阶段选择屏 -->
    <div class="screen active" id="screen-stage">
        <h1>爱情如死之坚强</h1>
        <p class="bible-verse">“求你将我放在心上如印记，带在你臂上如戳记...<br>爱情，众水不能熄灭。”<br>— 雅歌 8:6-7</p>
        <p>请选择你们当前所处的时期</p>
        <div style="display: flex; flex-direction: column; width: 100%; gap: 10px;">
            <button class="btn-3d" onclick="selectStage('恋爱期')">恋爱期 (Dating)</button>
            <button class="btn-3d" onclick="selectStage('定婚期')">定婚期 (Engagement)</button>
            <button class="btn-3d" onclick="selectStage('结婚')">结婚 (Marriage)</button>
            <button class="btn-3d" onclick="selectStage('备孕期')">备孕期 (Pre-pregnancy)</button>
            <button class="btn-3d" onclick="selectStage('孕后初期')">孕后初期 (Early Pregnancy)</button>
            <button class="btn-3d" onclick="selectStage('婚后进阶')">婚后进阶 (Advanced)</button>
        </div>
    </div>

    <!-- 2. 角色选择屏 -->
    <div class="screen" id="screen-role">
        <h1 id="role-stage-title">阶段</h1>
        <p>请选择你的身份<br>双方选择后，请将手机放置在一起</p>
        <button class="btn-3d" style="color: #4a90e2;" onclick="selectRole('boy')">我是男生 ♂</button>
        <button class="btn-3d" style="color: #ff6b81;" onclick="selectRole('girl')">我是女生 ♀</button>
    </div>

    <!-- 3. 合并动画屏 -->
    <div class="screen" id="screen-sync">
        <h1>双向奔赴</h1>
        <p>将两台手机靠近<br>点击下方按钮完成印记合并</p>
        
        <div class="sync-container" id="sync-animation-box">
            <!-- 动态注入男女半图 -->
        </div>

        <button class="btn-3d btn-primary" onclick="triggerSync()">确认合并印记</button>
    </div>

    <!-- 4. 内容步骤屏 (1:释义 2:操练 3:宣告) -->
    <div class="screen" id="screen-content">
        <div class="progress-bar" id="content-progress">
            <div class="progress-dot" id="dot-1"></div>
            <div class="progress-dot" id="dot-2"></div>
            <div class="progress-dot" id="dot-3"></div>
        </div>

        <!-- 标题(脑心手) -->
        <h1 id="content-type-title" style="margin-top: 2rem;">【心】的连接</h1>
        
        <!-- 动态内容区 -->
        <div id="content-box" style="flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%;">
            <h3 id="step-title" style="margin-bottom: 1rem; color: var(--theme-primary);">1. 行动真谛</h3>
            <p id="step-text">内容加载中...</p>
        </div>

        <!-- 操作区 -->
        <div id="action-area" style="width: 100%; min-height: 120px;">
            <button class="btn-3d btn-primary" id="btn-next-step" onclick="nextContentStep()">下一步</button>
            
            <!-- 长按按钮 (仅在最后一步显示) -->
            <div class="long-press-area" id="btn-long-press" style="display: none;">
                <div class="press-text">同心宣告<br>(长按)</div>
                <div class="press-fill" id="press-fill"></div>
            </div>
        </div>
    </div>

    <!-- 5. 完成屏 -->
    <div class="screen" id="screen-finish">
        <h1>今日印记已完成</h1>
        <p>众水不能熄灭爱情，<br>大水也不能淹没。</p>
        <p style="font-size: 0.9rem; color: #888;">背景音乐将持续播放，愿你们彼此相爱。</p>
        <button class="btn-3d" onclick="resetApp()">返回首页</button>
    </div>

</div>

<script>
    /* ================= 核心数据结构与配置 ================= */
    
    // 阶段主题颜色字典
    const themeConfig = {
        '恋爱期': { bg: '#fff2f5', text: '#3d2b2f', primary: '#ff6b81', shadowL: '#ffffff', shadowD: '#f0e1e4' },
        '定婚期': { bg: '#fdf7f2', text: '#3d3028', primary: '#f39c12', shadowL: '#ffffff', shadowD: '#ebe1d8' },
        '结婚':   { bg: '#fbf4f5', text: '#2c1e20', primary: '#e74c3c', shadowL: '#ffffff', shadowD: '#e8dcde' },
        '备孕期': { bg: '#f4fbf7', text: '#243329', primary: '#2ecc71', shadowL: '#ffffff', shadowD: '#d9ebd1' },
        '孕后初期': { bg: '#f4f8fb', text: '#212d36', primary: '#3498db', shadowL: '#ffffff', shadowD: '#dce5ed' },
        '婚后进阶': { bg: '#f8f5fb', text: '#282330', primary: '#9b59b6', shadowL: '#ffffff', shadowD: '#e6e0ef' }
    };

    // 脑心手内容数据库 (示例: 恋爱期)
    // 实际项目中，这里可以通过 Fetch API 从 R2 存储桶获取 JSON 文件
    const contentDB = {
        '恋爱期': {
            type: '心', 
            bgm: 'https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3',
            steps: [
                {
                    title: "一、 行为背后的意义",
                    text: "为什么我们要互相倾听？因为真正的爱不仅是身体的陪伴，更是灵魂的交融。倾听代表着“我愿意放下我的自我，去进入你的世界”。正如神倾听我们的祷告一般。"
                },
                {
                    title: "二、 今日具体操练",
                    text: "在接下来的相处中，当对方说话时，请放下手机，眼睛注视对方的眼睛。如果对方感到疲惫，请为对方倒一杯温水，并温和地说：“我在这里陪你。”"
                },
                {
                    title: "三、 同心宣读",
                    text: "（请牵起对方的手，一起读出：）\n\n我愿意将你放在心上如印记，我的耐心、我的温柔都愿为你存留。愿我们的爱在基督里得着坚固，不被琐事消磨，不被骄傲阻挡。"
                }
            ]
        }
        // ... 其他时期数据可在此无限扩展
    };

    /* ================= 状态管理 ================= */
    let state = {
        stage: '',
        role: '',
        currentStep: 0,
        contentData: null
    };

    let audioPlayer = document.getElementById('bgm-player');

    /* ================= 核心流程函数 ================= */

    // 切换屏幕
    function navigateTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // 1. 选择阶段
    function selectStage(stageName) {
        state.stage = stageName;
        
        // 动态切换全局主题
        const theme = themeConfig[stageName];
        if(theme) {
            document.documentElement.style.setProperty('--theme-bg', theme.bg);
            document.documentElement.style.setProperty('--theme-text', theme.text);
            document.documentElement.style.setProperty('--theme-primary', theme.primary);
            document.documentElement.style.setProperty('--theme-shadow-light', theme.shadowL);
            document.documentElement.style.setProperty('--theme-shadow-dark', theme.shadowD);
        }

        document.getElementById('role-stage-title').innerText = `【${stageName}】`;
        navigateTo('screen-role');
    }

    // 2. 选择角色 (展示割裂图)
    function selectRole(role) {
        state.role = role;
        
        // 构建割裂拼合 UI
        const syncBox = document.getElementById('sync-animation-box');
        syncBox.classList.remove('merged');
        
        if (role === 'boy') {
            syncBox.innerHTML = `<div class="sync-half boy"></div>`;
        } else {
            syncBox.innerHTML = `<div class="sync-half girl"></div>`;
        }

        navigateTo('screen-sync');
    }

    // 3. 触发合并动画并准备进入内容
    function triggerSync() {
        // 播放合并动画
        const syncBox = document.getElementById('sync-animation-box');
        syncBox.classList.add('merged');

        // 加载内容数据
        // 如果当前阶段没有 Mock 数据，默认使用恋爱期数据进行演示
        state.contentData = contentDB[state.stage] || contentDB['恋爱期'];
        state.currentStep = 0;

        // 设置专属 BGM
        if(state.contentData.bgm) {
            audioPlayer.src = state.contentData.bgm;
            // 处理移动端自动播放限制：在用户点击事件的调用栈中立刻执行 play()
            audioPlayer.play().catch(e => console.log("等待交互后播放音频", e));
        }

        // 动画停留 1.5 秒后进入内容引导
        setTimeout(() => {
            renderContentStep();
            navigateTo('screen-content');
        }, 1500);
    }

    // 4. 渲染对应的脑心手内容步骤
    function renderContentStep() {
        const stepData = state.contentData.steps[state.currentStep];
        
        document.getElementById('content-type-title').innerText = `今日操练：【${state.contentData.type}】`;
        document.getElementById('step-title').innerText = stepData.title;
        // 支持换行显示
        document.getElementById('step-text').innerHTML = stepData.text.replace(/\n/g, '<br>');

        // 更新进度点
        for(let i=1; i<=3; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (i - 1 === state.currentStep) dot.classList.add('active');
            else dot.classList.remove('active');
        }

        // 按钮显示逻辑控制
        const nextBtn = document.getElementById('btn-next-step');
        const longPressBtn = document.getElementById('btn-long-press');

        if (state.currentStep < 2) {
            // 步骤 1 和 2，显示下一步按钮
            nextBtn.style.display = 'flex';
            longPressBtn.style.display = 'none';
        } else {
            // 步骤 3，隐藏下一步，显示长按宣告按钮
            nextBtn.style.display = 'none';
            longPressBtn.style.display = 'flex';
        }
    }

    // 点击下一步
    function nextContentStep() {
        if (state.currentStep < 2) {
            state.currentStep++;
            // 添加文本淡入淡出动效
            const contentBox = document.getElementById('content-box');
            contentBox.style.opacity = 0;
            setTimeout(() => {
                renderContentStep();
                contentBox.style.transition = 'opacity 0.5s';
                contentBox.style.opacity = 1;
            }, 300);
        }
    }

    /* ================= 长按宣告逻辑 ================= */
    const longPressBtn = document.getElementById('btn-long-press');
    const pressFill = document.getElementById('press-fill');
    let pressTimer = null;
    let progress = 0;
    let animationFrame = null;

    function startPress(e) {
        if(e.type === 'touchstart') e.preventDefault(); // 防止双击放大和默认事件
        progress = 0;
        cancelAnimationFrame(animationFrame);
        
        // 每 16ms 增加进度，总共需要约 1.5 秒 (1500ms -> 约 90 帧)
        function updateProgress() {
            progress += (100 / 90); 
            pressFill.style.height = `${Math.min(progress, 100)}%`;
            
            if (progress >= 100) {
                completeAction();
            } else {
                animationFrame = requestAnimationFrame(updateProgress);
            }
        }
        animationFrame = requestAnimationFrame(updateProgress);
    }

    function endPress(e) {
        if(e.type === 'touchend') e.preventDefault();
        cancelAnimationFrame(animationFrame);
        if (progress < 100) {
            // 未完成，回退进度
            progress = 0;
            pressFill.style.height = `0%`;
        }
    }

    function completeAction() {
        cancelAnimationFrame(animationFrame);
        navigateTo('screen-finish');
    }

    // 绑定鼠标与触摸事件，确保跨端兼容
    longPressBtn.addEventListener('mousedown', startPress);
    longPressBtn.addEventListener('mouseup', endPress);
    longPressBtn.addEventListener('mouseleave', endPress);
    longPressBtn.addEventListener('touchstart', startPress, {passive: false});
    longPressBtn.addEventListener('touchend', endPress, {passive: false});
    longPressBtn.addEventListener('touchcancel', endPress, {passive: false});

    // 重置应用
    function resetApp() {
        state = { stage: '', role: '', currentStep: 0, contentData: null };
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        pressFill.style.height = `0%`;
        
        // 恢复默认主题
        document.documentElement.style.setProperty('--theme-bg', '#fdfbf7');
        document.documentElement.style.setProperty('--theme-text', '#2c2c2c');
        document.documentElement.style.setProperty('--theme-primary', '#d4af37');
        document.documentElement.style.setProperty('--theme-shadow-light', '#ffffff');
        document.documentElement.style.setProperty('--theme-shadow-dark', '#e6e4d9');
        
        navigateTo('screen-stage');
    }

</script>
</body>
</html>
