<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <title>恒久印记</title>
    <style>
        /* ================= 全局重置与 iOS 26 级双轨变量 ================= */
        :root {
            --theme-bg-color: #1a1b20;
            --theme-primary: #d4af37;
            --theme-secondary: #ebd373;
            --theme-text: #ffffff;
            --theme-glass-bg: rgba(20, 20, 25, 0.4);
            --theme-glass-border: rgba(255, 255, 255, 0.15);
            --theme-glass-shadow: rgba(0, 0, 0, 0.5);
            --theme-glass-inset: rgba(255, 255, 255, 0.1);
            --theme-input-bg: rgba(0, 0, 0, 0.3);
            
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-title: "Songti SC", "SimSun", serif;
        }

        body.light-theme {
            --theme-text: #1f2937;
            --theme-glass-bg: rgba(255, 255, 255, 0.65);
            --theme-glass-border: rgba(255, 255, 255, 0.8);
            --theme-glass-shadow: rgba(150, 160, 180, 0.15);
            --theme-glass-inset: rgba(255, 255, 255, 0.9);
            --theme-input-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body, html {
            width: 100%; max-width: 100vw; height: 100%;
            overflow-x: hidden; overflow-y: hidden; 
            background-color: var(--theme-bg-color); color: var(--theme-text);
            font-family: var(--font-main);
            transition: background-color 0.8s ease, color 0.8s ease;
        }

        #bg-gradient {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top center, var(--theme-secondary) 0%, var(--theme-bg-color) 80%);
            opacity: 0.18; z-index: 1; transition: background 1s ease;
        }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* ================= 核心容器 ================= */
        #app-container {
            position: relative; z-index: 10; width: 100%; max-width: 600px; height: 100%;
            margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: calc(env(safe-area-inset-top) + 2rem) 1.5rem calc(env(safe-area-inset-bottom) + 2rem) 1.5rem;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: scale(0.96) translateY(20px);
            overflow-y: auto; overflow-x: hidden;
        }
        .screen::-webkit-scrollbar { display: none; }
        .screen { -ms-overflow-style: none; scrollbar-width: none; }
        .screen.active { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); z-index: 20; }
        
        .screen.center-content { justify-content: center; }

        /* ================= iOS 26 Glassmorphism ================= */
        .glass-panel {
            background: var(--theme-glass-bg);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid var(--theme-glass-border);
            border-radius: 28px;
            box-shadow: 0 16px 40px var(--theme-glass-shadow), inset 0 1px 2px var(--theme-glass-inset);
            padding: 2rem; width: 100%; text-align: center; transition: all 0.5s ease;
        }

        .btn-glass {
            background: linear-gradient(135deg, var(--theme-glass-bg) 0%, transparent 100%);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--theme-glass-border);
            box-shadow: 0 8px 24px var(--theme-glass-shadow), inset 0 1px 2px var(--theme-glass-inset);
            color: var(--theme-text);
            padding: 1rem 2rem; font-size: 1.1rem; font-weight: 600; border-radius: 50px;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 85%; margin: 0.8rem auto; display: flex; justify-content: center; align-items: center; letter-spacing: 1px;
        }
        .btn-glass:active { transform: translateY(3px) scale(0.97); box-shadow: 0 2px 10px var(--theme-glass-shadow), inset 0 2px 5px rgba(0,0,0,0.1); }

        .btn-primary {
            background: linear-gradient(135deg, var(--theme-primary) 0%, var(--theme-secondary) 100%);
            border: none; color: #fff !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25), inset 0 2px 4px rgba(255,255,255,0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        input, textarea, select {
            width: 100%; background: var(--theme-input-bg);
            border: 1px solid var(--theme-glass-border); color: var(--theme-text);
            padding: 14px 18px; border-radius: 16px; margin-bottom: 15px; font-size: 1rem;
            outline: none; font-family: inherit; transition: border 0.3s, background 0.5s, color 0.5s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--theme-primary); }
        textarea { resize: vertical; min-height: 80px; }
        input::placeholder, textarea::placeholder { color: var(--theme-text); opacity: 0.5; }
        select option { background: var(--theme-bg-color); color: var(--theme-text); }

        /* ================= 排版 ================= */
        h1, h2, h3 { font-family: var(--font-title); letter-spacing: 1px; }
        h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin-bottom: 1rem; color: var(--theme-text); transition: color 0.5s; font-weight: 700; }
        p { font-size: clamp(0.95rem, 4vw, 1.1rem); line-height: 1.8; margin-bottom: 1.5rem; text-align: justify; text-align-last: center; }
        .slogan-verse { font-family: var(--font-title); font-size: 1.05rem; opacity: 0.8; margin-bottom: 2rem; }

        /* ================= 悬浮挂件 ================= */
        .widget-controls { position: absolute; top: calc(env(safe-area-inset-top) + 15px); left: 15px; z-index: 100; display: flex; gap: 10px; }
        .theme-toggle-btn {
            background: var(--theme-glass-bg); border: 1px solid var(--theme-glass-border); color: var(--theme-text);
            width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 8px 20px var(--theme-glass-shadow), inset 0 1px 1px var(--theme-glass-inset);
            font-size: 1.2rem; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: all 0.3s;
        }
        .theme-toggle-btn:active { transform: scale(0.9); }

        .apple-music-player {
            position: absolute; top: calc(env(safe-area-inset-top) + 15px); right: 15px; z-index: 100;
            background: rgba(10,10,10,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        .apple-music-player.playing { opacity: 1; pointer-events: auto; }
        .music-icon { width: 22px; height: 22px; border-radius: 6px; background-size: cover; background-position: center; background-image: url('music-artwork.png'); }
        .music-bars { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
        .bar { width: 3px; background: #fff; border-radius: 2px; animation: bounce 1s infinite alternate; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0% { height: 4px; } 100% { height: 16px; } }
        .link-text { color: var(--theme-text); font-size: 0.9rem; opacity: 0.7; text-decoration: underline; cursor: pointer; margin-top: 15px; display: inline-block; }

        /* ================= 3/4 阵列网格 (高级首屏排版) ================= */
        .stage-row-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 2vw, 15px); width: 100%; margin-bottom: clamp(8px, 2vw, 15px); }
        .stage-row-bottom { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 1.5vw, 12px); width: 100%; }
        
        .stage-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--theme-glass-border); border-radius: 20px;
            padding: clamp(10px, 3vw, 20px) 5px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px var(--theme-glass-shadow), inset 0 1px 1px rgba(255,255,255,0.1);
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .stage-card:active { transform: translateY(2px) scale(0.96); box-shadow: 0 2px 5px var(--theme-glass-shadow), inset 0 2px 5px rgba(0,0,0,0.1); }
        
        .stage-card-title {
            margin-top: 10px; font-weight: 600; font-size: clamp(0.75rem, 2.5vw, 1rem);
            color: var(--theme-text); letter-spacing: 1px; pointer-events: none; text-align: center;
        }

        .stage-icon-dropzone {
            width: clamp(45px, 12vw, 65px); height: clamp(45px, 12vw, 65px); border-radius: 50%;
            background-size: cover; background-position: center; background-color: var(--theme-input-bg);
            border: 2px solid transparent; transition: all 0.3s; position: relative;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            box-shadow: 0 4px 10px var(--theme-glass-shadow);
        }
        .edit-mode .stage-icon-dropzone { border: 2px dashed var(--theme-primary); cursor: pointer; pointer-events: auto; }

        /* ================= 卡片列表 ================= */
        .cat-tabs-container {
            display: flex; gap: 12px; overflow-x: auto; width: 100%; padding: 10px 5px 20px 5px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .cat-tabs-container::-webkit-scrollbar { display: none; }
        
        .cat-tab {
            padding: 8px 20px; border-radius: 20px; font-size: 1rem; font-weight: 600; white-space: nowrap;
            background: var(--theme-glass-bg); border: 1px solid var(--theme-glass-border);
            color: var(--theme-text); opacity: 0.6; transition: all 0.3s; cursor: pointer;
            box-shadow: 0 4px 10px var(--theme-glass-shadow);
        }
        .cat-tab.active { opacity: 1; background: var(--theme-primary); color: #fff; border-color: transparent; box-shadow: 0 6px 15px rgba(0,0,0,0.2); }

        .module-section { width: 100%; text-align: left; margin-bottom: 30px; }
        .module-title { font-size: 1.15rem; margin-bottom: 15px; color: var(--theme-primary); font-family: var(--font-title); display: flex; align-items: center; gap: 8px; font-weight: bold; }
        /* 前置圆点修饰 */
        .module-title::before { content: ''; width: 6px; height: 18px; background: var(--theme-primary); border-radius: 4px; }

        .content-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; width: 100%;
        }

        .data-card {
            position: relative;
            background: var(--theme-glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--theme-glass-border); border-radius: 22px;
            padding: 1.2rem 1rem; display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 8px 24px var(--theme-glass-shadow), inset 0 1px 2px var(--theme-glass-inset);
            aspect-ratio: 1 / 1; 
        }
        .data-card:active { transform: scale(0.95); box-shadow: 0 4px 12px var(--theme-glass-shadow); }
        .data-card.draggable { cursor: grab; }
        
        .card-inner-title { font-size: 1rem; font-weight: 600; margin-bottom: 10px; text-align: center; line-height: 1.4; color: var(--theme-text); }
        .card-tag { font-size: 0.75rem; background: rgba(128,128,128,0.2); padding: 4px 12px; border-radius: 12px; opacity: 0.8; color: var(--theme-text); }

        .admin-controls { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 15px); left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 95%; }
        .btn-small { padding: 8px 16px; font-size: 0.85rem; border-radius: 20px; width: auto; margin: 0; }
        
        /* 悬浮边缘操作按钮 */
        .admin-card-actions { position: absolute; top: -8px; right: -8px; display: none; gap: 6px; flex-direction: column; z-index: 5; }
        .edit-mode .admin-card-actions { display: flex; }
        .edit-mode .data-card { border: 1px dashed var(--theme-primary); }
        .action-icon { width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.65); color: #fff; display: flex; justify-content: center; align-items: center; font-size: 0.75rem; backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); transition: transform 0.2s; }
        .action-icon:active { transform: scale(0.9); }

        /* ================= 进度与合并动画 ================= */
        .progress-bar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--theme-glass-border); transition: all 0.4s; }
        .progress-dot.active { background-color: var(--theme-primary); transform: scale(1.3); box-shadow: 0 0 8px var(--theme-primary); }

        .sync-container { width: 250px; height: 250px; position: relative; margin: 2rem auto; border-radius: 50%; box-shadow: 0 15px 40px var(--theme-glass-shadow), inset 0 2px 10px var(--theme-glass-inset); background: var(--theme-input-bg); overflow: hidden; backdrop-filter: blur(15px); }
        .sync-half { position: absolute; top: 0; width: 50%; height: 100%; background-size: cover; background-repeat: no-repeat; transition: transform 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .sync-half.boy { left: 0; background-position: left center; transform: translateX(-120%); opacity: 0.3; border-right: 1px solid var(--theme-glass-border); }
        .sync-half.girl { right: 0; background-position: right center; transform: translateX(120%); opacity: 0.3; border-left: 1px solid var(--theme-glass-border); }
        .sync-container.merged .boy { transform: translateX(0); opacity: 1; border-right: transparent; }
        .sync-container.merged .girl { transform: translateX(0); opacity: 1; border-left: transparent; }

        /* ================= 长按宣告进度 ================= */
        .long-press-area { position: relative; width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, var(--theme-glass-bg), transparent); box-shadow: 0 10px 35px var(--theme-glass-shadow), inset 0 2px 4px var(--theme-glass-inset); display: flex; justify-content: center; align-items: center; margin: 2rem auto; cursor: pointer; overflow: hidden; border: 1px solid var(--theme-glass-border); }
        .press-text { font-weight: bold; color: var(--theme-text); z-index: 2; font-size: 1.1rem; }
        .press-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--theme-primary); opacity: 0.7; transition: height 0.1s linear; z-index: 1; }

        /* ================= 模态框 ================= */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 999; display: none; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--theme-bg-color); border: 1px solid var(--theme-glass-border); border-radius: 28px; padding: 25px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 2px var(--theme-glass-inset); box-sizing: border-box; }
        .modal-content::-webkit-scrollbar { display: none; }
        .qr-image { width: 200px; height: auto; border-radius: 16px; margin: 20px auto; display: block; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }

    </style>
</head>
<body>

<div id="bg-gradient"></div>
<canvas id="particle-canvas"></canvas>
<audio id="bgm-player" loop preload="auto"></audio>

<div class="widget-controls" id="theme-widget">
    <div class="theme-toggle-btn" onclick="toggleTheme()" id="btn-theme">🌙</div>
</div>
<div class="apple-music-player" id="apple-music-box">
    <div class="music-icon"></div>
    <div class="music-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
</div>

<div id="app-container">
    
    <div class="admin-controls" id="top-admin-controls" style="display: none;">
        <button class="btn-glass btn-small" onclick="toggleEditMode()" id="btn-edit-toggle">开启深度编辑</button>
        <button class="btn-glass btn-small" onclick="logout()">退出管理</button>
    </div>

    <!-- 0. 登录屏 -->
    <div class="screen active center-content" id="screen-login">
        <div class="glass-panel">
            <h1>恒久印记</h1>
            <p class="slogan-verse">爱情，众水不能熄灭，大水也不能淹没</p>
            <input type="text" id="ipt-username" placeholder="账号 (限英文/数字组合)" autocomplete="off">
            <input type="password" id="ipt-pwd" placeholder="密码" autocomplete="off">
            <button class="btn-glass btn-primary" onclick="handleLogin()">登 录</button>
            <button class="btn-glass" onclick="handleRegister()">注 册</button>
            <span class="link-text" onclick="showModal('qr-modal')">联系站长</span>
        </div>
    </div>

    <!-- 1. 阶段选择屏 (3/4 阵列布局) -->
    <div class="screen center-content" id="screen-stage">
        <h1 style="margin-top:20px;">恒久印记</h1>
        <p class="slogan-verse">选择生命当前的季节，开始今日的操练</p>
        <div class="glass-panel" style="padding: 1.5rem 1rem; background: transparent; border: none; box-shadow: none;">
            <div id="stage-buttons-container" style="width: 100%;">
                <!-- 动态渲染 3/4 行网格 -->
            </div>
        </div>
    </div>

    <!-- 2. 分类与卡片列表屏 -->
    <div class="screen" id="screen-card-list" style="padding-top: calc(env(safe-area-inset-top) + 70px);">
        <h1 id="list-stage-title" style="margin-bottom: 5px;">阶段卡片</h1>
        <p style="opacity: 0.8; margin-bottom: 20px;">顺服引导，操练爱意</p>
        
        <div class="admin-card-actions edit-mode-only" style="width: 100%; flex-direction: row; flex-wrap:wrap; justify-content: center; gap: 10px; margin-bottom: 15px; display: none; position: static;">
            <button class="btn-glass btn-small btn-primary" onclick="openEditModal(null)">+ 新增卡片</button>
            <button class="btn-glass btn-small" onclick="manageCategories()">管理大选项</button>
            <button class="btn-glass btn-small" onclick="editPrepText()">预备提示语</button>
        </div>

        <div class="cat-tabs-container" id="cat-tabs-container"></div>
        <div id="card-list-container" style="width: 100%; flex: 1;"></div>
        
        <button class="btn-glass" style="margin: 30px auto;" onclick="navigateTo('screen-stage')">返回首页</button>
    </div>

    <!-- 3. 预备提醒屏 (触发音乐唤醒) -->
    <div class="screen center-content" id="screen-prep">
        <div class="glass-panel">
            <h1 style="color: var(--theme-primary);">操练预备</h1>
            <p id="prep-text" style="font-size: 1.1rem; margin: 2.5rem 0;">...</p>
            <button class="btn-glass btn-primary" onclick="confirmPrepAndPlay()">我们已预备好</button>
        </div>
    </div>

    <!-- 4. 角色选择屏 -->
    <div class="screen center-content" id="screen-role">
        <h1 id="role-stage-title">缔结印记</h1>
        <p style="margin-bottom: 2.5rem;">请选择您的身份<br>随后将两台手机并排平放</p>
        <button class="btn-glass" style="border-color: #4a90e2; color: #4a90e2;" onclick="selectRole('boy')">我是男生 ♂</button>
        <button class="btn-glass" style="border-color: #ff6b81; color: #ff6b81;" onclick="selectRole('girl')">我是女生 ♀</button>
    </div>

    <!-- 5. 合并动画屏 -->
    <div class="screen center-content" id="screen-sync">
        <h1>双向奔赴</h1>
        <p>确认手机贴合后，点击合并印记</p>
        <div class="sync-container" id="sync-animation-box"></div>
        <button class="btn-glass btn-primary" onclick="triggerSync()">确 认 合 并</button>
    </div>

    <!-- 6. 核心内容屏 -->
    <div class="screen center-content" id="screen-content">
        <div class="progress-bar" id="content-progress">
            <div class="progress-dot" id="dot-1"></div><div class="progress-dot" id="dot-2"></div><div class="progress-dot" id="dot-3"></div>
        </div>
        <div class="glass-panel" style="flex: 1; display: flex; flex-direction: column; justify-content: center; margin-bottom: 20px; min-height: 50vh;">
            <h2 id="content-type-title" style="margin-bottom: 1rem; font-size: 1.1rem; opacity: 0.8; letter-spacing: 2px;"></h2>
            <h1 id="step-title" style="color: var(--theme-primary); font-size: 1.4rem; margin-bottom: 1.5rem;"></h1>
            <p id="step-text" style="font-size: 1.05rem; text-align: left; text-align-last: left; line-height: 1.9;"></p>
        </div>
        
        <div id="action-area" style="width: 100%; min-height: 150px;">
            <button class="btn-glass btn-primary" id="btn-next-step" onclick="nextContentStep()">进 入 下 一 步</button>
            <div class="long-press-area" id="btn-long-press" style="display: none;">
                <div class="press-text">同心宣告<br>(长按)</div>
                <div class="press-fill" id="press-fill"></div>
            </div>
        </div>
    </div>

    <!-- 7. 完成屏 -->
    <div class="screen center-content" id="screen-finish">
        <div class="glass-panel">
            <h1 style="color: var(--theme-primary);">印记已成</h1>
            <p>众水不能熄灭爱情，大水也不能淹没。</p>

        <textarea id="edit-s1-text" placeholder="为什么我们要如此做..."></textarea>

        <input type="text" id="edit-s2-title" placeholder="步骤标题">
        <textarea id="edit-s2-text" placeholder="日常生活中具体的互动指引..."></textarea>

        <h4 style="margin: 15px 0 10px 5px; color:var(--theme-primary);">步骤 3: 同心宣告</h4>
        <input type="text" id="edit-s3-title" placeholder="步骤标题">
        <textarea id="edit-s3-text" placeholder="邀请双方一起同声宣读的内容..."></textarea>

            <button class="btn-glass btn-primary" style="margin:0;" onclick="saveCard()">保 存</button>
            <button class="btn-glass" style="margin:0;" onclick="hideModal('edit-modal')">取 消</button>
        </div>

</div>

<script>
    /* ================= 1. 高级数据中枢与双轨主题配置 ================= */
    const stagesList = ['单身期', '恋爱期', '定婚期', '结婚', '备孕期', '孕后初期', '婚后进阶'];

    const defaultDB = {
        users: {}, 
        stages: {
            '单身期': {
                themeParams: { dark: { bg: '#10141a', p: '#6366f1', s: '#818cf8' }, light: { bg: '#f0f4f8', p: '#4f46e5', s: '#818cf8' } },
                icon: '', prepText: '静心安息，在独处的时光中沉淀自我。请找一个安静的地方，深呼吸，预备进入内心的探索。',
                categories: [{ id: 'cat_s1', name: '不想进入婚姻' }, { id: 'cat_s2', name: '我想进入婚姻' }],
                cards: [{ id: 'c_s_1', categoryId: 'cat_s1', title: '拥抱此刻的完整', type: '心', bgm: '', steps: [{title:'认知',text:'单身本身即是完整，非过渡期。'},{title:'操练',text:'今日为自己做一顿精美的晚餐。'},{title:'宣告',text:'我在爱中富足，不因外在状态而匮乏。'}] }]
            },
            '恋爱期': {
                themeParams: { dark: { bg: '#1a1114', p: '#d4af37', s: '#ec4899' }, light: { bg: '#fdf7f9', p: '#d97706', s: '#f472b6' } },
                icon: '', prepText: '相对而坐，保持一臂距离，深呼吸两次，放下外界的喧嚣，预备心灵进入交流。',
                categories: [{ id: 'cat_l1', name: '核心操练' }],
                cards: [{ id: 'c_l_1', categoryId: 'cat_l1', title: '倾听的艺术', type: '脑', bgm: '', steps: [{title:'行为意义',text:'倾听是灵魂的交融。'},{title:'具体操练',text:'注视对方眼睛，放下手机。'},{title:'同心宣告',text:'我愿将你放在心上如印记。'}] }]
            },
            '定婚期': { themeParams: { dark: { bg: '#1a1610', p: '#d4af37', s: '#f59e0b' }, light: { bg: '#fcfaf5', p: '#d97706', s: '#fcd34d' } }, icon: '', prepText: '即将步入婚姻殿堂，回想决定携手一生的初心。', categories: [{id:'cat_e1',name:'盟约预备'}], cards: [] },
            '结婚': { themeParams: { dark: { bg: '#1c1012', p: '#d4af37', s: '#ef4444' }, light: { bg: '#fdf5f5', p: '#dc2626', s: '#fca5a5' } }, icon: '', prepText: '誓言要在日常点滴中活出。请拥抱彼此。', categories: [{id:'cat_m1',name:'合二为一'}], cards: [] },
            '备孕期': { themeParams: { dark: { bg: '#101c17', p: '#d4af37', s: '#10b981' }, light: { bg: '#f4fbf7', p: '#059669', s: '#6ee7b7' } }, icon: '', prepText: '滋养爱情，把手放在对方的肩上。', categories: [{id:'cat_p1',name:'孕育之爱'}], cards: [] },
            '孕后初期': { themeParams: { dark: { bg: '#10171c', p: '#d4af37', s: '#0ea5e9' }, light: { bg: '#f4f9fd', p: '#0284c7', s: '#7dd3fc' } }, icon: '', prepText: '疲惫需要温柔承托，轻揉肩膀放松。', categories: [{id:'cat_ep1',name:'温柔承托'}], cards: [] },
            '婚后进阶': { themeParams: { dark: { bg: '#16121c', p: '#d4af37', s: '#8b5cf6' }, light: { bg: '#faf5ff', p: '#7c3aed', s: '#c4b5fd' } }, icon: '', prepText: '全然接纳此刻真实的对方。', categories: [{id:'cat_a1',name:'平淡坚守'}], cards: [] }
        }
    };

    let db = JSON.parse(localStorage.getItem('sealOfLoveDB_v5'));
    if (!db) {
        let oldDb = JSON.parse(localStorage.getItem('sealOfLoveDB_v4'));
        if (oldDb && oldDb.stages) {
            db = oldDb;
            stagesList.forEach(k => {
                if(!db.stages[k]) db.stages[k] = JSON.parse(JSON.stringify(defaultDB.stages[k])); 
                if (!db.stages[k].categories) {
                    db.stages[k].categories = [{ id: 'cat_def_' + Date.now(), name: '核心操练' }];
                    if(db.stages[k].cards) db.stages[k].cards.forEach(c => c.categoryId = db.stages[k].categories[0].id);
                }
                if (db.stages[k].themeParams && db.stages[k].themeParams.bg) {
                    let oldP = db.stages[k].themeParams;
                    db.stages[k].themeParams = { dark: { bg: oldP.bg, p: oldP.p, s: oldP.s }, light: defaultDB.stages[k] ? defaultDB.stages[k].themeParams.light : { bg: '#fdfaf3', p: oldP.p, s: oldP.s } };
                }
            });
        } else db = defaultDB;
        saveDB();
    }

    function saveDB() { localStorage.setItem('sealOfLoveDB_v5', JSON.stringify(db)); }

    /* ================= 2. 状态机与双轨主题引擎 ================= */
    let state = {
        isLoggedIn: false, isAdmin: false, isEditMode: false,
        stage: '', activeCategoryId: '', currentCard: null, role: '', currentStep: 0,
        isLightTheme: false
    };

    function toggleTheme() {
        state.isLightTheme = !state.isLightTheme;
        document.getElementById('btn-theme').innerText = state.isLightTheme ? '☀️' : '🌙';
        if (state.isLightTheme) document.body.classList.add('light-theme');
        else document.body.classList.remove('light-theme');
        if(state.stage) applyStageTheme(state.stage);
    }

    /* ================= 3. 对称粒子系统 ================= */
    const canvas = document.getElementById('particle-canvas'); const ctx = canvas.getContext('2d');
    let particles = []; let animationId;
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * (canvas.width / 2); this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.5; this.speedY = Math.random() * 0.4 - 0.2;
            this.speedX = Math.random() * 0.2 - 0.1; this.baseAlpha = Math.random() * 0.4 + 0.1;
            this.pulse = Math.random() * Math.PI;
        }
        update() {
            this.y += this.speedY; this.x += this.speedX;
            if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            if (this.x < 0) this.x = canvas.width / 2; if (this.x > canvas.width / 2) this.x = 0;
            this.pulse += 0.02;
        }
        draw(colorStr) {
            const alpha = this.baseAlpha + Math.sin(this.pulse) * 0.2;
            ctx.fillStyle = colorStr.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width - this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }
    function initParticles() { particles = []; const count = window.innerWidth < 600 ? 25 : 50; for (let i = 0; i < count; i++) particles.push(new Particle()); }
    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-primary').trim();
        const hexToRgb = hex => { let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return isNaN(r) ? 'rgb(212,175,55)' : `rgb(${r},${g},${b})`; };
        const colorStr = primaryColor.startsWith('#') ? hexToRgb(primaryColor) : 'rgb(212,175,55)';
        particles.forEach(p => { p.update(); p.draw(colorStr); });
        animationId = requestAnimationFrame(animateParticles);
    }
    initParticles(); animateParticles();

    /* ================= 4. 安全鉴权引擎 ================= */
    async function handleLogin() {
        const u = document.getElementById('ipt-username').value.trim(); const p = document.getElementById('ipt-pwd').value.trim();
        if(!u || !p) return alert('请输入账号和密码');
        try {
            const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
            if (response.ok) {
                const result = await response.json();
                if(result.success) { state.isLoggedIn = true; state.isAdmin = true; initStageScreen(); return; }
            }
        } catch (error) { console.log("后端鉴权降级至本地测试"); }
        if(db.users[u] && db.users[u] === p) { state.isLoggedIn = true; state.isAdmin = false; initStageScreen(); } 
        else alert('账号或密码错误。');
    }

    function handleRegister() {
        const u = document.getElementById('ipt-username').value.trim(); const p = document.getElementById('ipt-pwd').value.trim();
        if(!u || !p) return alert('请填写完整'); if (!/^[a-zA-Z0-9]+$/.test(u)) return alert('仅限英文数字组合');
        if(db.users[u]) return alert('账号已存在'); db.users[u] = p; saveDB();
        state.isLoggedIn = true; state.isAdmin = false; initStageScreen();
    }

    function logout() {
        state.isLoggedIn = false; state.isAdmin = false; state.isEditMode = false;
        document.getElementById('top-admin-controls').style.display = 'none';
        navigateTo('screen-login');
        document.body.classList.remove('light-theme'); state.isLightTheme = false; document.getElementById('btn-theme').innerText = '🌙';
        document.documentElement.style.setProperty('--theme-bg-color', '#1a1b20'); document.documentElement.style.setProperty('--theme-primary', '#d4af37');
    }

    function toggleEditMode() {
        state.isEditMode = !state.isEditMode;
        document.getElementById('btn-edit-toggle').innerText = state.isEditMode ? '关闭深度编辑' : '开启深度编辑';
        const actDisplays = document.querySelectorAll('.edit-mode-only');
        actDisplays.forEach(el => el.style.display = state.isEditMode ? 'flex' : 'none');
        if (document.getElementById('screen-stage').classList.contains('active')) initStageScreen();
        else if (document.getElementById('screen-card-list').classList.contains('active')) renderCardList();
    }

    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function hideModal(id) { document.getElementById(id).style.display = 'none'; }

    function navigateTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active'); document.getElementById(screenId).scrollTop = 0;
    }

    function applyStageTheme(stageName) {
        const t = db.stages[stageName].themeParams;
        const root = document.documentElement;
        const currentParams = state.isLightTheme ? t.light : t.dark;
        root.style.setProperty('--theme-bg-color', currentParams.bg);
        root.style.setProperty('--theme-primary', currentParams.p);
        root.style.setProperty('--theme-secondary', currentParams.s);
    }

    /* ================= 5. 3/4 不对称高定排版 ================= */
    function initStageScreen() {
        document.getElementById('top-admin-controls').style.display = state.isAdmin ? 'flex' : 'none';
        
        const currentParams = state.isLightTheme ? { bg: '#fdfaf3', p: '#d99a29', s: '#f4c453' } : { bg: '#1a1b20', p: '#d4af37', s: '#ebd373' };
        document.documentElement.style.setProperty('--theme-bg-color', currentParams.bg);
        document.documentElement.style.setProperty('--theme-primary', currentParams.p);
        document.documentElement.style.setProperty('--theme-secondary', currentParams.s);

        const container = document.getElementById('stage-buttons-container');
        container.innerHTML = '';
        if(state.isEditMode) container.classList.add('edit-mode'); else container.classList.remove('edit-mode');

        // 构建顶部 3 列网格
        const rowTop = document.createElement('div'); rowTop.className = 'stage-row-top';
        // 构建底部 4 列网格
        const rowBottom = document.createElement('div'); rowBottom.className = 'stage-row-bottom';

        stagesList.forEach((sName, index) => {
            const iconB64 = db.stages[sName].icon;
            const card = document.createElement('div'); card.className = 'stage-card';
            card.onclick = (e) => { if(!state.isEditMode) selectStage(sName); };

            const iconDiv = document.createElement('div'); iconDiv.className = 'stage-icon-dropzone';
            if (iconB64) { iconDiv.style.backgroundImage = `url(${iconB64})`; } 
            else { iconDiv.innerHTML = `<span style="font-size: clamp(14px, 4vw, 24px); color:var(--theme-text); opacity:0.8;">${sName.charAt(0)}</span>`; }

            if (state.isEditMode) {
                iconDiv.addEventListener('click', (e) => { e.stopPropagation(); const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.onchange = ev => {if(ev.target.files[0]) processIcon(ev.target.files[0], sName)}; input.click(); });
            }
            const title = document.createElement('div'); title.className = 'stage-card-title'; title.innerText = sName;
            card.appendChild(iconDiv); card.appendChild(title); 
            
            if (index < 3) rowTop.appendChild(card); else rowBottom.appendChild(card);
        });
        
        container.appendChild(rowTop); container.appendChild(rowBottom);
        navigateTo('screen-stage');
    }
    
    function processIcon(file, stageName) {
        if (file.size > 2 * 1024 * 1024) return alert('图片限制 2MB');
        const reader = new FileReader(); reader.onload = ev => { db.stages[stageName].icon = ev.target.result; saveDB(); initStageScreen(); }; reader.readAsDataURL(file);
    }

    /* ================= 6. 分类大选项与瀑布流卡片 ================= */
    function selectStage(sName) {
        if(state.isEditMode) return;
        state.stage = sName; applyStageTheme(sName);
        document.getElementById('list-stage-title').innerText = `${sName}`;
        
        const cats = db.stages[sName].categories || [];
        if(cats.length > 0) state.activeCategoryId = cats[0].id; else state.activeCategoryId = '';

        renderCardList(); navigateTo('screen-card-list');
    }

    function renderCardList() {
        if (state.isEditMode) document.getElementById('screen-card-list').classList.add('edit-mode');
        else document.getElementById('screen-card-list').classList.remove('edit-mode');

        const cats = db.stages[state.stage].categories || [];
        const tabContainer = document.getElementById('cat-tabs-container'); tabContainer.innerHTML = '';
        
        if (cats.length > 1 || state.isEditMode) {
            cats.forEach(cat => {
                const tab = document.createElement('div'); tab.className = `cat-tab ${cat.id === state.activeCategoryId ? 'active' : ''}`;
                tab.innerText = cat.name; tab.onclick = () => { state.activeCategoryId = cat.id; renderCardList(); };
                tabContainer.appendChild(tab);
            });
        }

        const container = document.getElementById('card-list-container'); container.innerHTML = '';
        const activeCards = db.stages[state.stage].cards.filter(c => c.categoryId === state.activeCategoryId);
        const modules = ['脑', '心', '手']; let hasRenderedAny = false;

        modules.forEach(modType => {
            const modCards = activeCards.filter(c => c.type === modType);
            if(modCards.length > 0 || state.isEditMode) {
                hasRenderedAny = true;
                const section = document.createElement('div'); section.className = 'module-section';
                section.innerHTML = `<div class="module-title">${modType}之连结</div>`;
                const grid = document.createElement('div'); grid.className = 'content-grid';
                
                modCards.forEach((card) => {
                    const cardDiv = document.createElement('div'); cardDiv.className = 'data-card';
                    cardDiv.innerHTML = `<h3 class="card-inner-title">${card.title}</h3><span class="card-tag">${modType}板块</span>`;
                    
                    if (state.isEditMode) {
                        const globalIndex = db.stages[state.stage].cards.findIndex(c => c.id === card.id);
                        const actDiv = document.createElement('div'); actDiv.className = 'admin-card-actions';
                        actDiv.innerHTML = `<div class="action-icon" onclick="event.stopPropagation(); openEditModal(${globalIndex})">✎</div><div class="action-icon" style="background:rgba(239,68,68,0.85);" onclick="event.stopPropagation(); deleteCard(${globalIndex})">✖</div>`;
                        cardDiv.appendChild(actDiv);
                    }
                    cardDiv.onclick = () => { if(!state.isEditMode) selectCard(card); };
                    grid.appendChild(cardDiv);
                });
                
                if(modCards.length === 0 && state.isEditMode) {
                    grid.innerHTML = `<p style="opacity:0.4; font-size:0.8rem; text-align:center; width:100%; grid-column: 1 / -1;">该板块暂无卡片</p>`;
                }
                section.appendChild(grid); container.appendChild(section);
            }
        });

        if(!hasRenderedAny) container.innerHTML = '<p style="opacity:0.5; margin-top:20px; text-align:center;">当前分类暂无内容</p>';
    }

    /* ====== 大选项 (分类) 管理 ====== */
    function manageCategories() {
        const listDiv = document.getElementById('cat-list-edit'); listDiv.innerHTML = '';
        const cats = db.stages[state.stage].categories || [];
        cats.forEach((cat, idx) => {
            const div = document.createElement('div'); div.style.display = 'flex'; div.style.gap = '10px';
            div.innerHTML = `<input type="text" style="margin:0;" id="cat_input_${idx}" value="${cat.name}"><button class="btn-glass" style="width:40px; margin:0; color:#ef4444; padding:0;" onclick="removeCat(${idx})">✖</button>`;
            listDiv.appendChild(div);
        });
        showModal('cat-modal');
    }
    function addNewCategory() {
        if(!db.stages[state.stage].categories) db.stages[state.stage].categories = [];
        db.stages[state.stage].categories.push({ id: 'cat_' + Date.now(), name: '新建大选项' }); manageCategories();
    }
    function removeCat(idx) {
        const catId = db.stages[state.stage].categories[idx].id;
        const linkedCards = db.stages[state.stage].cards.filter(c => c.categoryId === catId);
        if(linkedCards.length > 0 && !confirm(`该分类下有 ${linkedCards.length} 张卡片，删除分类将把这些卡片变成无头数据。确定删除吗？`)) return;
        db.stages[state.stage].categories.splice(idx, 1); manageCategories();
    }
    function saveCategories() {
        const cats = db.stages[state.stage].categories || [];
        cats.forEach((cat, idx) => { const input = document.getElementById(`cat_input_${idx}`); if(input) cat.name = input.value; });
        saveDB(); hideModal('cat-modal'); 
        if(!cats.find(c => c.id === state.activeCategoryId) && cats.length > 0) state.activeCategoryId = cats[0].id;
        renderCardList();
    }

    /* ====== 卡片编辑 ====== */
    function editPrepText() { const t = prompt("预备提醒文本：", db.stages[state.stage].prepText); if (t !== null) { db.stages[state.stage].prepText = t; saveDB(); } }
    function deleteCard(index) { if(confirm('确认删除？')) { db.stages[state.stage].cards.splice(index, 1); saveDB(); renderCardList(); } }

    function openEditModal(index) {
        const isNew = (index === null);
        document.getElementById('modal-title').innerText = isNew ? '新增卡片' : '编辑卡片';
        
        const catSelect = document.getElementById('edit-card-category'); catSelect.innerHTML = '';
        const cats = db.stages[state.stage].categories || [];
        cats.forEach(c => { catSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`; });

        let c = isNew ? { id: 'c_'+Date.now(), categoryId: state.activeCategoryId, title:'', type:'心', bgm:'', steps:[{title:'', text:''},{title:'', text:''},{title:'', text:''}] } : db.stages[state.stage].cards[index];

        document.getElementById('edit-card-id').value = index === null ? 'new' : index;
        document.getElementById('edit-card-category').value = c.categoryId || (cats[0]?cats[0].id:'');
        document.getElementById('edit-card-type').value = c.type;
        document.getElementById('edit-card-title').value = c.title;
        document.getElementById('edit-card-bgm').value = c.bgm || '';
        
        for(let i=1; i<=3; i++) {
            document.getElementById(`edit-s${i}-title`).value = c.steps[i-1] ? c.steps[i-1].title : '';
            document.getElementById(`edit-s${i}-text`).value = c.steps[i-1] ? c.steps[i-1].text : '';
        }
        showModal('edit-modal');
    }

    function saveCard() {
        const idxStr = document.getElementById('edit-card-id').value;
        const c = {
            id: idxStr === 'new' ? 'c_' + Date.now() : db.stages[state.stage].cards[parseInt(idxStr)].id,
            categoryId: document.getElementById('edit-card-category').value,
            title: document.getElementById('edit-card-title').value || '未命名',
            type: document.getElementById('edit-card-type').value || '心',
            bgm: document.getElementById('edit-card-bgm').value,
            steps: []
        };
        for(let i=1; i<=3; i++) c.steps.push({ title: document.getElementById(`edit-s${i}-title`).value, text: document.getElementById(`edit-s${i}-text`).value });

        if(idxStr === 'new') db.stages[state.stage].cards.push(c); else db.stages[state.stage].cards[parseInt(idxStr)] = c;
        saveDB(); hideModal('edit-modal'); renderCardList();
    }

    /* ================= 7. 音频预备与播放缓动引擎 ================= */
    let audioPlayer = document.getElementById('bgm-player');
    
    function selectCard(card) {
        state.currentCard = card;
        document.getElementById('prep-text').innerText = db.stages[state.stage].prepText;
        navigateTo('screen-prep');
    }

    // 唤醒音乐并淡入
    function confirmPrepAndPlay() {
        if(state.currentCard && state.currentCard.bgm) {
            if(audioPlayer.src !== state.currentCard.bgm) { audioPlayer.src = state.currentCard.bgm; }
            audioPlayer.volume = 0; // 初始音量设为 0
            audioPlayer.play().then(() => { 
                document.getElementById('apple-music-box').classList.add('playing'); 
                // 缓动渐入音量
                let vol = 0;
                const fadeInterval = setInterval(() => {
                    vol += 0.05;
                    if(vol >= 1) { audioPlayer.volume = 1; clearInterval(fadeInterval); } 
                    else { audioPlayer.volume = vol; }
                }, 100);
            }).catch(e => console.log("等待交互后播放", e));
        }
        navigateTo('screen-role');
    }

    function selectRole(role) {
        state.role = role;
        const syncBox = document.getElementById('sync-animation-box'); syncBox.classList.remove('merged');
        const iconB64 = db.stages[state.stage].icon;
        const bgStyle = iconB64 ? `background-image: url(${iconB64});` : `background: var(--theme-primary);`;
        
        if (role === 'boy') syncBox.innerHTML = `<div class="sync-half boy" style="${bgStyle} background-size: cover;"></div>`;
        else syncBox.innerHTML = `<div class="sync-half girl" style="${bgStyle} background-size: cover;"></div>`;
        navigateTo('screen-sync');
    }

    function triggerSync() {
        document.getElementById('sync-animation-box').classList.add('merged');
        state.currentStep = 0;
        setTimeout(() => { renderContentStep(); navigateTo('screen-content'); }, 1500);
    }

    function renderContentStep() {
        const stepData = state.currentCard.steps[state.currentStep];
        document.getElementById('content-type-title').innerText = `【${state.currentCard.type}】的连结`;
        document.getElementById('step-title').innerText = stepData.title;
        document.getElementById('step-text').innerHTML = stepData.text.replace(/\n/g, '<br><br>');

        for(let i=1; i<=3; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (i - 1 === state.currentStep) dot.classList.add('active'); else dot.classList.remove('active');
        }

        const nextBtn = document.getElementById('btn-next-step'); const longPressBtn = document.getElementById('btn-long-press');
        if (state.currentStep < 2) { nextBtn.style.display = 'flex'; longPressBtn.style.display = 'none'; } 
        else { nextBtn.style.display = 'none'; longPressBtn.style.display = 'flex'; }
    }

    function nextContentStep() {
        if (state.currentStep < 2) {
            state.currentStep++;
            const t = document.getElementById('step-title'); const p = document.getElementById('step-text');
            t.style.opacity = 0; p.style.opacity = 0;
            setTimeout(() => { renderContentStep(); t.style.transition = 'opacity 0.5s'; p.style.transition = 'opacity 0.5s'; t.style.opacity = 1; p.style.opacity = 1; }, 300);
        }
    }

    /* ================= 8. 长按宣告与完结 ================= */
    const longPressBtn = document.getElementById('btn-long-press'); const pressFill = document.getElementById('press-fill');
    let progress = 0; let pressFrame = null; let isPressing = false;

    function startPress(e) {
        if(e.type === 'touchstart') e.preventDefault(); if(isPressing) return;
        isPressing = true; progress = 0; cancelAnimationFrame(pressFrame);
        function up() { if(!isPressing) return; progress += (100/90); pressFill.style.height = `${Math.min(progress, 100)}%`; if (progress >= 100) { isPressing = false; completeAction(); } else pressFrame = requestAnimationFrame(up); }
        pressFrame = requestAnimationFrame(up);
    }
    function endPress(e) { if(e.type === 'touchend') e.preventDefault(); isPressing = false; cancelAnimationFrame(pressFrame); if (progress < 100) { progress = 0; pressFill.style.height = `0%`; } }
    function completeAction() { cancelAnimationFrame(pressFrame); navigateTo('screen-finish'); }

    longPressBtn.addEventListener('mousedown', startPress); longPressBtn.addEventListener('mouseup', endPress); longPressBtn.addEventListener('mouseleave', endPress);
    longPressBtn.addEventListener('touchstart', startPress, {passive: false}); longPressBtn.addEventListener('touchend', endPress, {passive: false}); longPressBtn.addEventListener('touchcancel', endPress, {passive: false});

    function resetToStage() {
        document.getElementById('apple-music-box').classList.remove('playing');
        audioPlayer.pause(); audioPlayer.currentTime = 0; pressFill.style.height = `0%`;
        state.currentCard = null; state.role = ''; state.currentStep = 0;
        initStageScreen();
    }

</script>
</body>
</html>
