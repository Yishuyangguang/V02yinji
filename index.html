<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 读取 GitHub 仓库中的静态图标 -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <title>恒久印记</title>
    <style>
        /* ================= 全局重置与双轨变量 ================= */
        :root {
            /* 默认深色：柔和黑金 */
            --theme-bg-color: #1a1b20;
            --theme-primary: #d4af37;
            --theme-secondary: #ebd373;
            --theme-text: #ffffff;
            --theme-glass-bg: rgba(255, 255, 255, 0.05);
            --theme-glass-border: rgba(255, 255, 255, 0.1);
            --theme-glass-shadow: rgba(0, 0, 0, 0.4);
            --theme-input-bg: rgba(0, 0, 0, 0.3);
            
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-title: "Songti SC", "SimSun", serif;
        }

        /* 浅色：柔和太阳光 */
        body.light-theme {
            --theme-bg-color: #fdfaf3;
            --theme-primary: #d99a29;
            --theme-secondary: #f4c453;
            --theme-text: #333333;
            --theme-glass-bg: rgba(255, 255, 255, 0.7);
            --theme-glass-border: rgba(200, 180, 150, 0.3);
            --theme-glass-shadow: rgba(200, 180, 150, 0.2);
            --theme-input-bg: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            max-width: 100vw;
            height: 100%;
            overflow-x: hidden; /* 绝对防止横向溢出 */
            overflow-y: hidden; 
            background-color: var(--theme-bg-color);
            color: var(--theme-text);
            font-family: var(--font-main);
            transition: background-color 0.8s ease, color 0.8s ease;
        }

        /* 背景渐变与 Canvas */
        #bg-gradient {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--theme-secondary) 0%, var(--theme-bg-color) 70%);
            opacity: 0.15;
            z-index: 1;
            transition: background 1s ease;
        }
        
        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* ================= 核心容器 ================= */
        #app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0.95);
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .screen::-webkit-scrollbar { display: none; }
        .screen { -ms-overflow-style: none; scrollbar-width: none; }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            z-index: 20;
        }

        /* ================= 3D 玻璃态样式 (Glassmorphism) ================= */
        .glass-panel {
            background: var(--theme-glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--theme-glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 var(--theme-glass-shadow),
                        inset 0 1px 1px rgba(255,255,255,0.2);
            padding: 2rem;
            width: 100%;
            text-align: center;
            transition: all 0.5s ease;
        }

        .btn-glass {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--theme-glass-border);
            box-shadow: 0 4px 15px var(--theme-glass-shadow), inset 0 1px 1px rgba(255,255,255,0.2);
            color: var(--theme-text);
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            width: 85%;
            margin: 0.8rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 1px;
        }

        .btn-glass:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 2px 5px var(--theme-glass-shadow), inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--theme-primary) 0%, var(--theme-secondary) 100%);
            border: none;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2), inset 0 2px 2px rgba(255,255,255,0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        input, textarea {
            width: 100%;
            background: var(--theme-input-bg);
            border: 1px solid var(--theme-glass-border);
            color: var(--theme-text);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            transition: border 0.3s, background 0.5s, color 0.5s;
        }
        input:focus, textarea:focus { border-color: var(--theme-primary); }
        textarea { resize: vertical; min-height: 80px; }
        
        input::placeholder, textarea::placeholder {
            color: var(--theme-text);
            opacity: 0.5;
        }

        /* ================= 排版 ================= */
        h1, h2, h3 { font-family: var(--font-title); letter-spacing: 2px; }
        h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin-bottom: 1rem; color: var(--theme-text); transition: color 0.5s; }
        p { font-size: clamp(0.95rem, 4vw, 1.1rem); line-height: 1.8; margin-bottom: 1.5rem; text-align: justify; text-align-last: center; }
        .slogan-verse { font-family: var(--font-title); font-size: 1.05rem; opacity: 0.9; margin-bottom: 2rem; }

        /* ================= 小挂件 ================= */
        .widget-controls {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            display: flex; gap: 10px;
        }
        
        .theme-toggle-btn {
            background: var(--theme-glass-bg);
            border: 1px solid var(--theme-glass-border);
            color: var(--theme-text);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 10px var(--theme-glass-shadow);
            font-size: 1.2rem; backdrop-filter: blur(10px);
        }

        /* 苹果风黑色音乐播放框 */
        .apple-music-player {
            position: absolute; top: 20px; right: 20px; z-index: 100;
            background: #111111; 
            border-radius: 14px;
            padding: 8px 12px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        .apple-music-player.playing { opacity: 1; pointer-events: auto; }
        
        .music-icon {
            width: 20px; height: 20px; border-radius: 4px;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-image: url('music-artwork.png');
        }
        .music-bars { display: flex; gap: 3px; align-items: flex-end; height: 15px; }
        .bar { width: 3px; background: #fff; border-radius: 2px; animation: bounce 1s infinite alternate; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0% { height: 4px; } 100% { height: 14px; } }

        .link-text { color: var(--theme-text); font-size: 0.9rem; opacity: 0.7; text-decoration: underline; cursor: pointer; margin-top: 15px; display: inline-block; }

        /* ================= 阶段卡片网格 (双列) ================= */
        .stage-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            padding: 5px;
        }

        .stage-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--theme-glass-border);
            border-radius: 20px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--theme-glass-shadow), inset 0 1px 1px rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .stage-card:active {
            transform: translateY(2px) scale(0.96);
            box-shadow: 0 2px 5px var(--theme-glass-shadow), inset 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stage-card-title {
            margin-top: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--theme-text);
            letter-spacing: 1px;
            pointer-events: none;
        }

        .stage-icon-dropzone {
            width: 65px; height: 65px; border-radius: 50%;
            background-size: cover; background-position: center; background-color: var(--theme-input-bg);
            border: 2px solid transparent; transition: all 0.3s; position: relative;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            box-shadow: 0 4px 10px var(--theme-glass-shadow);
        }
        .edit-mode .stage-icon-dropzone { border: 2px dashed var(--theme-primary); cursor: pointer; pointer-events: auto; }

        /* ================= 操练卡片列表 ================= */
        .admin-controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
            display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 90%;
        }
        .btn-small { padding: 8px 15px; font-size: 0.85rem; border-radius: 20px; width: auto; margin: 0; }
        
        .card-list { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; padding-bottom: 100px; }
        
        .day-card {
            position: relative;
            background: linear-gradient(135deg, var(--theme-glass-bg), transparent);
            backdrop-filter: blur(8px);
            border: 1px solid var(--theme-glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.3s;
            box-shadow: 0 4px 15px var(--theme-glass-shadow);
        }
        .day-card:active { transform: scale(0.98); }
        .day-card.draggable { cursor: grab; }
        
        .card-info { text-align: left; pointer-events: none; }
        .card-info h3 { margin-bottom: 5px; font-size: 1.1rem; }
        .card-info span { font-size: 0.8rem; opacity: 0.7; background: rgba(128,128,128,0.2); padding: 3px 8px; border-radius: 10px; }
        
        .admin-card-actions { display: none; gap: 5px; }
        .edit-mode .admin-card-actions { display: flex; }
        .edit-mode .day-card { border: 1px dashed var(--theme-primary); }

        /* ================= 合并动画 ================= */
        .progress-bar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--theme-glass-border); transition: all 0.4s; }
        .progress-dot.active { background-color: var(--theme-primary); transform: scale(1.3); box-shadow: 0 0 8px var(--theme-primary); }

        .sync-container {
            width: 240px; height: 240px; position: relative; margin: 2rem auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px var(--theme-glass-shadow), inset 0 2px 10px rgba(255,255,255,0.2);
            background: var(--theme-input-bg); overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .sync-half {
            position: absolute; top: 0; width: 50%; height: 100%;
            background-size: cover; background-repeat: no-repeat;
            transition: transform 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .sync-half.boy { left: 0; background-position: left center; transform: translateX(-120%); opacity: 0.3; border-right: 1px solid var(--theme-glass-border); }
        .sync-half.girl { right: 0; background-position: right center; transform: translateX(120%); opacity: 0.3; border-left: 1px solid var(--theme-glass-border); }
        .sync-container.merged .boy { transform: translateX(0); opacity: 1; border-right: transparent; }
        .sync-container.merged .girl { transform: translateX(0); opacity: 1; border-left: transparent; }

        /* ================= 长按宣告进度 ================= */
        .long-press-area {
            position: relative; width: 130px; height: 130px; border-radius: 50%;
            background: linear-gradient(135deg, var(--theme-glass-bg), transparent);
            box-shadow: 0 8px 32px var(--theme-glass-shadow), inset 0 1px 2px rgba(255,255,255,0.3);
            display: flex; justify-content: center; align-items: center; margin: 2rem auto;
            cursor: pointer; overflow: hidden; border: 1px solid var(--theme-glass-border);
        }
        .press-text { font-weight: bold; color: var(--theme-text); z-index: 2; font-size: 1rem; }
        .press-fill {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: var(--theme-primary); opacity: 0.6; transition: height 0.1s linear; z-index: 1;
        }

        /* ================= 模态框 (后台编辑/微信二维码) ================= */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); z-index: 999;
            display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--theme-bg-color); border: 1px solid var(--theme-glass-border);
            border-radius: 20px; padding: 20px; width: 100%; max-height: 90%; overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .qr-image { width: 200px; height: auto; border-radius: 12px; margin: 15px auto; display: block; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

    </style>
</head>
<body>

<!-- 对称粒子背景 -->
<div id="bg-gradient"></div>
<canvas id="particle-canvas"></canvas>

<!-- 预加载音频 -->
<audio id="bgm-player" loop preload="auto"></audio>

<!-- 顶部挂件：主题切换 -->
<div class="widget-controls" id="theme-widget">
    <div class="theme-toggle-btn" onclick="toggleTheme()" id="btn-theme">🌙</div>
</div>

<!-- 顶部挂件：苹果风音乐播放框 -->
<div class="apple-music-player" id="apple-music-box">
    <div class="music-icon"></div>
    <div class="music-bars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
</div>

<div id="app-container">
    
    <!-- 全局管理控件 -->
    <div class="admin-controls" id="top-admin-controls" style="display: none;">
        <button class="btn-glass btn-small" onclick="toggleEditMode()" id="btn-edit-toggle">开启卡片编辑</button>
        <button class="btn-glass btn-small" onclick="logout()">退出管理</button>
    </div>

    <!-- 0. 登录/注册屏 -->
    <div class="screen active" id="screen-login">
        <div class="glass-panel">
            <h1>恒久印记</h1>
            <p class="slogan-verse">爱情，众水不能熄灭，大水也不能淹没</p>
            <input type="text" id="ipt-username" placeholder="账号 (限英文/数字组合)" autocomplete="off">
            <input type="password" id="ipt-pwd" placeholder="密码" autocomplete="off">
            <button class="btn-glass btn-primary" onclick="handleLogin()">登 录</button>
            <button class="btn-glass" onclick="handleRegister()">注 册</button>
            <span class="link-text" onclick="showQRModal()">联系站长</span>
        </div>
    </div>

    <!-- 1. 阶段选择屏 (2列网格卡片) -->
    <div class="screen" id="screen-stage">
        <h1>恒久印记</h1>
        <p class="slogan-verse">选择生命当前的季节，开始今日的操练</p>
        <div class="glass-panel" style="padding: 1rem 0; background: transparent; border: none; box-shadow: none;">
            <div id="stage-buttons-container" class="stage-grid">
                <!-- 动态渲染 2 列网格卡片 -->
            </div>
        </div>
    </div>

    <!-- 2. 内容卡片列表屏 -->
    <div class="screen" id="screen-card-list">
        <h1 id="list-stage-title">阶段卡片</h1>
        <p>选择今日的操练内容</p>
        
        <div class="admin-card-actions" style="width: 100%; margin-bottom: 10px; justify-content: center; gap: 10px;">
            <button class="btn-glass btn-small btn-primary" onclick="openEditModal(null)">+ 添加新卡片</button>
            <button class="btn-glass btn-small" onclick="editPrepText()">修改预备提示</button>
        </div>

        <div class="card-list" id="card-list-container">
            <!-- 动态渲染玻璃卡片 -->
        </div>
        <button class="btn-glass" style="margin-bottom: 30px;" onclick="navigateTo('screen-stage')">返回上一步</button>
    </div>

    <!-- 3. 预备提醒屏 -->
    <div class="screen" id="screen-prep">
        <div class="glass-panel">
            <h1 style="color: var(--theme-primary);">操练预备</h1>
            <p id="prep-text" style="font-size: 1.1rem; margin: 2rem 0;">...</p>
            <button class="btn-glass btn-primary" onclick="navigateTo('screen-role')">我们已预备好</button>
        </div>
    </div>

    <!-- 4. 角色选择屏 -->
    <div class="screen" id="screen-role">
        <h1 id="role-stage-title">角色</h1>
        <p>请选择你的身份<br>选择后，请将两台手机并排平放</p>
        <button class="btn-glass" style="border-color: #4a90e2; color: #4a90e2;" onclick="selectRole('boy')">我是男生 ♂</button>
        <button class="btn-glass" style="border-color: #ff6b81; color: #ff6b81;" onclick="selectRole('girl')">我是女生 ♀</button>
    </div>

    <!-- 5. 合并动画屏 -->
    <div class="screen" id="screen-sync">
        <h1>双向奔赴</h1>
        <p>确认手机贴合后，点击合并印记</p>
        <div class="sync-container" id="sync-animation-box">
            <!-- 动态注入切割的上传图片 -->
        </div>
        <button class="btn-glass btn-primary" onclick="triggerSync()">确认合并印记</button>
    </div>

    <!-- 6. 核心内容屏 -->
    <div class="screen" id="screen-content">
        <div class="progress-bar" id="content-progress">
            <div class="progress-dot" id="dot-1"></div>
            <div class="progress-dot" id="dot-2"></div>
            <div class="progress-dot" id="dot-3"></div>
        </div>
        <div class="glass-panel" style="flex: 1; display: flex; flex-direction: column; justify-content: center; margin-bottom: 20px;">
            <h2 id="content-type-title" style="margin-bottom: 1rem; font-size: 1.2rem; opacity: 0.8;">【心】的连接</h2>
            <h1 id="step-title" style="color: var(--theme-primary); font-size: 1.5rem; margin-bottom: 1.5rem;">标题</h1>
            <p id="step-text" style="font-size: 1.1rem; text-align: left; text-align-last: left;">内容...</p>
        </div>
        
        <div id="action-area" style="width: 100%; min-height: 140px;">
            <button class="btn-glass btn-primary" id="btn-next-step" onclick="nextContentStep()">下一步</button>
            <div class="long-press-area" id="btn-long-press" style="display: none;">
                <div class="press-text">同心宣告<br>(长按)</div>
                <div class="press-fill" id="press-fill"></div>
            </div>
        </div>
    </div>

    <!-- 7. 完成屏 -->
    <div class="screen" id="screen-finish">
        <div class="glass-panel">
            <h1 style="color: var(--theme-primary);">印记已成</h1>
            <p>众水不能熄灭爱情，大水也不能淹没。</p>
            <p style="font-size: 0.9rem; opacity: 0.7; margin-top: 2rem;">静谧的旋律将伴随你们，享受此刻的宁静。</p>
            <button class="btn-glass" onclick="resetToStage()">返回主页</button>
        </div>
    </div>

</div>

<!-- ================= 弹窗模块 ================= -->

<!-- 联系微信二维码弹窗 -->
<div class="modal-overlay" id="qr-modal">
    <div class="modal-content" style="text-align: center; max-width: 320px;">
        <h2 style="color: var(--theme-primary);">联系站长</h2>
        <!-- 调用本地微信图片 -->
        <img src="微信二维码.jpg" alt="微信二维码" class="qr-image" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23ddd\'/><text x=\'50\' y=\'50\' text-anchor=\'middle\' dominant-baseline=\'middle\' fill=\'%23666\'>二维码图片丢失</text></svg>'">
        <p style="font-size: 0.9rem; opacity: 0.8;">扫一扫上面的二维码图案，加我微信</p>
        <button class="btn-glass" style="margin-top: 15px;" onclick="hideQRModal()">关 闭</button>
    </div>
</div>

<!-- 管理员：编辑卡片模态框 -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 15px; color: var(--theme-primary);" id="modal-title">编辑卡片</h2>
        <input type="hidden" id="edit-card-id">
        <input type="text" id="edit-card-title" placeholder="卡片名称 (如: Day 1: 倾听的心)">
        <input type="text" id="edit-card-type" placeholder="类型 (脑/心/手)">
        <input type="text" id="edit-card-bgm" placeholder="背景音乐 URL (R2 存储桶直链)">
        
        <h4 style="margin: 10px 0;">步骤 1: 行为解释</h4>
        <input type="text" id="edit-s1-title" placeholder="标题">
        <textarea id="edit-s1-text" placeholder="解释内容..."></textarea>
        
        <h4 style="margin: 10px 0;">步骤 2: 具体操练</h4>
        <input type="text" id="edit-s2-title" placeholder="标题">
        <textarea id="edit-s2-text" placeholder="操练指引..."></textarea>

        <h4 style="margin: 10px 0;">步骤 3: 同心宣告</h4>
        <input type="text" id="edit-s3-title" placeholder="标题">
        <textarea id="edit-s3-text" placeholder="宣读词..."></textarea>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-glass btn-primary" style="margin:0;" onclick="saveCard()">保 存</button>
            <button class="btn-glass" style="margin:0;" onclick="closeEditModal()">取 消</button>
        </div>
    </div>
</div>

<script>
    /* ================= 1. 数据结构与初始化 ================= */
    
    const defaultDB = {
        users: { 'yishuyangguang': 'caoheng199410' }, 
        stages: {
            '恋爱期': {
                themeParams: { bg: '#1a1114', p: '#d4af37', s: '#ec4899' },
                icon: '',
                prepText: '请找一个安静且不受打扰的地方。相对而坐，保持适当的距离，深呼吸两次，放下外界的喧嚣，预备心灵进入这一刻的交流。',
                cards: [
                    {
                        id: 'c_date_1', title: 'Day 1: 倾听的艺术', type: '心', bgm: 'https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3',
                        steps: [
                            { title: '一、 行为背后的意义', text: '为什么我们要互相倾听？因为真正的爱不仅是表面的陪伴，更是灵魂深处的交融。倾听代表着“我愿意放下自我的成见，去进入你的内心世界”，正如倾听内心最深处的呼唤一般。' },
                            { title: '二、 今日具体操练', text: '在接下来的相处中，当对方说话时，请放下手机，眼神柔和地注视对方。如果对方感到疲惫，请为对方倒一杯温水，并温和地说：“我在这里陪你。”' },
                            { title: '三、 同心宣读', text: '（请牵起对方的手，一起读出：）\n\n我愿意将你放在心上如印记，我的耐心、我的温柔都愿为你存留。愿我们的爱情得着坚固，不被琐事消磨，不被骄傲阻挡。' }
                        ]
                    }
                ]
            },
            '定婚期': { themeParams: { bg: '#1a1610', p: '#d4af37', s: '#f59e0b' }, icon: '', prepText: '即将步入婚姻的殿堂，请彼此手牵手，回想决定携手一生的初心与感动。', cards: [] },
            '结婚': { themeParams: { bg: '#1c1012', p: '#d4af37', s: '#ef4444' }, icon: '', prepText: '在众人与岁月面前的誓言，如今要在日常点滴中活出。请温柔地拥抱彼此。', cards: [] },
            '备孕期': { themeParams: { bg: '#101c17', p: '#d4af37', s: '#10b981' }, icon: '', prepText: '迎接新生命前，先滋养你们二人的爱情。请把手放在对方的肩上，感受彼此的温度。', cards: [] },
            '孕后初期': { themeParams: { bg: '#10171c', p: '#d4af37', s: '#0ea5e9' }, icon: '', prepText: '身体的疲惫需要更多的温柔承托。请男生为女生轻揉肩膀，女生深呼吸放松。', cards: [] },
            '婚后进阶': { themeParams: { bg: '#16121c', p: '#d4af37', s: '#8b5cf6' }, icon: '', prepText: '平淡岁月里的坚守最为可贵。请放下对彼此一切的预设与要求，全然接纳此刻真实的对方。', cards: [] }
        }
    };

    for(let k in defaultDB.stages) {
        if(defaultDB.stages[k].cards.length === 0) {
            defaultDB.stages[k].cards.push(JSON.parse(JSON.stringify(defaultDB.stages['恋爱期'].cards[0])));
            defaultDB.stages[k].cards[0].id = 'c_' + Date.now() + Math.random();
            defaultDB.stages[k].cards[0].title = '示例操练卡 - 请在后台修改';
        }
    }

    let db = JSON.parse(localStorage.getItem('sealOfLoveDB_v3'));
    if (!db) {
        db = defaultDB;
        saveDB();
    } else {
        if(!db.users['yishuyangguang']) db.users['yishuyangguang'] = 'caoheng199410'; 
    }

    function saveDB() {
        localStorage.setItem('sealOfLoveDB_v3', JSON.stringify(db));
    }

    /* ================= 2. 状态与主题切换 ================= */
    let state = {
        isLoggedIn: false, isAdmin: false, isEditMode: false,
        stage: '', currentCard: null, role: '', currentStep: 0,
        isLightTheme: false
    };

    function toggleTheme() {
        state.isLightTheme = !state.isLightTheme;
        if (state.isLightTheme) {
            document.body.classList.add('light-theme');
            document.getElementById('btn-theme').innerText = '☀️';
        } else {
            document.body.classList.remove('light-theme');
            document.getElementById('btn-theme').innerText = '🌙';
        }
    }

    let audioPlayer = document.getElementById('bgm-player');
    const stagesList = ['恋爱期', '定婚期', '结婚', '备孕期', '孕后初期', '婚后进阶'];

    /* ================= 3. 对称粒子系统 ================= */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationId;

    function resizeCanvas() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.x = Math.random() * (canvas.width / 2);
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.5;
            this.speedY = Math.random() * 0.4 - 0.2;
            this.speedX = Math.random() * 0.2 - 0.1;
            this.baseAlpha = Math.random() * 0.5 + 0.1;
            this.pulse = Math.random() * Math.PI;
        }
        update() {
            this.y += this.speedY; this.x += this.speedX;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
            if (this.x < 0) this.x = canvas.width / 2;
            if (this.x > canvas.width / 2) this.x = 0;
            this.pulse += 0.02;
        }
        draw(colorStr) {
            const alpha = this.baseAlpha + Math.sin(this.pulse) * 0.2;
            ctx.fillStyle = colorStr.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width - this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const count = window.innerWidth < 600 ? 25 : 50;
        for (let i = 0; i < count; i++) particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-primary').trim();
        const hexToRgb = hex => {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return isNaN(r) ? 'rgb(212,175,55)' : `rgb(${r},${g},${b})`;
        };
        const colorStr = primaryColor.startsWith('#') ? hexToRgb(primaryColor) : 'rgb(212,175,55)';
        particles.forEach(p => { p.update(); p.draw(colorStr); });
        animationId = requestAnimationFrame(animateParticles);
    }
    initParticles(); animateParticles();

    /* ================= 4. 鉴权与后台逻辑 ================= */
    function handleLogin() {
        const u = document.getElementById('ipt-username').value.trim();
        const p = document.getElementById('ipt-pwd').value.trim();
        if(db.users[u] && db.users[u] === p) {
            state.isLoggedIn = true;
            state.isAdmin = (u === 'yishuyangguang');
            document.getElementById('theme-widget').style.display = 'none';
            initStageScreen();
        } else {
            alert('账号或密码错误。');
        }
    }

    function handleRegister() {
        const u = document.getElementById('ipt-username').value.trim();
        const p = document.getElementById('ipt-pwd').value.trim();
        if(!u || !p) return alert('请输入账号和密码');
        
        const nameRegex = /^[a-zA-Z0-9]+$/;
        if (!nameRegex.test(u)) {
            return alert('注册失败：用户名仅支持使用英文、数字或英文数字的组合，不允许出现特殊字符或空格。');
        }

        if(db.users[u]) return alert('账号已存在');
        db.users[u] = p;
        saveDB();
        alert('注册成功，已自动登录。');
        state.isLoggedIn = true;
        state.isAdmin = false;
        document.getElementById('theme-widget').style.display = 'none';
        initStageScreen();
    }

    function logout() {
        state.isLoggedIn = false; state.isAdmin = false; state.isEditMode = false;
        document.getElementById('top-admin-controls').style.display = 'none';
        document.getElementById('theme-widget').style.display = 'flex';
        navigateTo('screen-login');
        document.body.classList.remove('light-theme'); state.isLightTheme = false; 
        document.getElementById('btn-theme').innerText = '🌙';
    }

    function toggleEditMode() {
        state.isEditMode = !state.isEditMode;
        document.getElementById('btn-edit-toggle').innerText = state.isEditMode ? '关闭编辑' : '开启卡片编辑';
        if (document.getElementById('screen-stage').classList.contains('active')) initStageScreen();
        else if (document.getElementById('screen-card-list').classList.contains('active')) renderCardList();
    }

    function showQRModal() { document.getElementById('qr-modal').style.display = 'flex'; }
    function hideQRModal() { document.getElementById('qr-modal').style.display = 'none'; }
    
    /* ================= 5. 核心路由与主题 ================= */
    function navigateTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        document.getElementById(screenId).scrollTop = 0;
    }

    function applyStageTheme(stageName) {
        const t = db.stages[stageName].themeParams;
        const root = document.documentElement;
        if (state.isLightTheme) {
            document.body.classList.remove('light-theme');
            state.isLightTheme = false;
        }
        root.style.setProperty('--theme-bg-color', t.bg);
        root.style.setProperty('--theme-primary', t.p);
        root.style.setProperty('--theme-secondary', t.s);
    }

    /* ================= 6. 阶段网格卡片 (双列、上传图标) ================= */
    function initStageScreen() {
        document.getElementById('top-admin-controls').style.display = state.isAdmin ? 'flex' : 'none';
        
        document.documentElement.style.setProperty('--theme-bg-color', '#1a1b20');
        document.documentElement.style.setProperty('--theme-primary', '#d4af37');
        document.documentElement.style.setProperty('--theme-secondary', '#ebd373');

        const container = document.getElementById('stage-buttons-container');
        container.innerHTML = '';
        if(state.isEditMode) container.classList.add('edit-mode');
        else container.classList.remove('edit-mode');

        stagesList.forEach(sName => {
            const iconB64 = db.stages[sName].icon;
            
            // 构建网格卡片
            const card = document.createElement('div');
            card.className = 'stage-card';
            card.onclick = (e) => {
                if(!state.isEditMode) selectStage(sName);
            };

            const iconDiv = document.createElement('div');
            iconDiv.className = 'stage-icon-dropzone';
            if (iconB64) {
                iconDiv.style.backgroundImage = `url(${iconB64})`;
            } else {
                iconDiv.innerHTML = `<span style="font-size:24px;color:rgba(255,255,255,0.8); font-family: var(--font-title);">${sName.charAt(0)}</span>`;
                iconDiv.style.background = 'linear-gradient(135deg, rgba(255,255,255,0.1), transparent)';
            }

            if (state.isEditMode) {
                iconDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
                    input.onchange = ev => processStageIcon(ev.target.files[0], sName);
                    input.click();
                });
                iconDiv.addEventListener('dragover', (e) => { e.preventDefault(); iconDiv.style.borderColor = 'var(--theme-primary)'; });
                iconDiv.addEventListener('dragleave', () => { iconDiv.style.borderColor = 'transparent'; });
                iconDiv.addEventListener('drop', (e) => {
                    e.preventDefault(); e.stopPropagation(); iconDiv.style.borderColor = 'transparent';
                    const file = e.dataTransfer.files[0];
                    processStageIcon(file, sName);
                });
            }

            const title = document.createElement('div');
            title.className = 'stage-card-title';
            title.innerText = sName;

            card.appendChild(iconDiv);
            card.appendChild(title);
            container.appendChild(card);
        });
        navigateTo('screen-stage');
    }

    function processStageIcon(file, stageName) {
        if (!file || !file.type.startsWith('image/')) return;
        if (file.size > 2 * 1024 * 1024) return alert('图片不能超过 2MB');
        const reader = new FileReader();
        reader.onload = ev => { db.stages[stageName].icon = ev.target.result; saveDB(); initStageScreen(); };
        reader.readAsDataURL(file);
    }

    /* ================= 7. 卡片列表与编辑 ================= */
    function selectStage(sName) {
        if(state.isEditMode) return;
        state.stage = sName;
        applyStageTheme(sName);
        document.getElementById('list-stage-title').innerText = `${sName} 操练`;
        
        if (state.isEditMode) document.getElementById('screen-card-list').classList.add('edit-mode');
        else document.getElementById('screen-card-list').classList.remove('edit-mode');

        renderCardList(); navigateTo('screen-card-list');
    }

    function renderCardList() {
        const container = document.getElementById('card-list-container');
        container.innerHTML = '';
        const cards = db.stages[state.stage].cards;

        if (state.isEditMode) document.getElementById('screen-card-list').classList.add('edit-mode');
        else document.getElementById('screen-card-list').classList.remove('edit-mode');

        if(cards.length === 0) container.innerHTML = '<p style="opacity:0.5">暂无内容，请管理员添加。</p>';

        cards.forEach((card, index) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'day-card';
            if(state.isEditMode) cardDiv.classList.add('draggable');
            cardDiv.draggable = state.isEditMode;

            if (state.isEditMode) {
                cardDiv.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', index); setTimeout(() => cardDiv.style.opacity = '0.5', 0); });
                cardDiv.addEventListener('dragend', () => cardDiv.style.opacity = '1');
                cardDiv.addEventListener('dragover', e => e.preventDefault());
                cardDiv.addEventListener('drop', e => {
                    e.preventDefault();
                    const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    if(fromIndex !== index) {
                        const movedCard = cards.splice(fromIndex, 1)[0];
                        cards.splice(index, 0, movedCard);
                        saveDB(); renderCardList();
                    }
                });
            }

            cardDiv.innerHTML = `<div class="card-info" style="flex:1"><h3>${card.title}</h3><span>【${card.type}】模块</span></div>`;

            if (state.isEditMode) {
                const actDiv = document.createElement('div');
                actDiv.style.display = 'flex'; actDiv.style.gap = '5px';
                actDiv.innerHTML = `
                    <button class="btn-glass btn-small" onclick="event.stopPropagation(); openEditModal(${index})">✎</button>
                    <button class="btn-glass btn-small" style="color:#ff6b81;" onclick="event.stopPropagation(); deleteCard(${index})">✖</button>
                `;
                cardDiv.appendChild(actDiv);
            }
            cardDiv.onclick = () => { if(!state.isEditMode) selectCard(card); };
            container.appendChild(cardDiv);
        });
    }

    function editPrepText() {
        const t = prompt("修改该阶段的预备提醒文本：", db.stages[state.stage].prepText);
        if (t !== null) { db.stages[state.stage].prepText = t; saveDB(); }
    }

    function deleteCard(index) {
        if(confirm('确认删除此卡片吗？')) { db.stages[state.stage].cards.splice(index, 1); saveDB(); renderCardList(); }
    }

    function openEditModal(index) {
        const modal = document.getElementById('edit-modal');
        const isNew = (index === null);
        document.getElementById('modal-title').innerText = isNew ? '添加新卡片' : '编辑卡片';
        
        let c = isNew ? { id: 'c_'+Date.now(), title:'', type:'心', bgm:'', steps:[{title:'', text:''},{title:'', text:''},{title:'', text:''}] } : db.stages[state.stage].cards[index];

        document.getElementById('edit-card-id').value = index === null ? 'new' : index;
        document.getElementById('edit-card-title').value = c.title;
        document.getElementById('edit-card-type').value = c.type;
        document.getElementById('edit-card-bgm').value = c.bgm || '';
        
        for(let i=1; i<=3; i++) {
            document.getElementById(`edit-s${i}-title`).value = c.steps[i-1] ? c.steps[i-1].title : '';
            document.getElementById(`edit-s${i}-text`).value = c.steps[i-1] ? c.steps[i-1].text : '';
        }
        modal.style.display = 'flex';
    }

    function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

    function saveCard() {
        const idxStr = document.getElementById('edit-card-id').value;
        const c = {
            id: 'c_' + Date.now(),
            title: document.getElementById('edit-card-title').value || '未命名卡片',
            type: document.getElementById('edit-card-type').value || '心',
            bgm: document.getElementById('edit-card-bgm').value,
            steps: []
        };
        for(let i=1; i<=3; i++) c.steps.push({ title: document.getElementById(`edit-s${i}-title`).value, text: document.getElementById(`edit-s${i}-text`).value });

        if(idxStr === 'new') db.stages[state.stage].cards.push(c);
        else { c.id = db.stages[state.stage].cards[parseInt(idxStr)].id; db.stages[state.stage].cards[parseInt(idxStr)] = c; }
        
        saveDB(); closeEditModal(); renderCardList();
    }

    /* ================= 8. 用户操作流转 ================= */
    function selectCard(card) {
        state.currentCard = card;
        document.getElementById('prep-text').innerText = db.stages[state.stage].prepText;
        navigateTo('screen-prep');
    }

    function selectRole(role) {
        state.role = role;
        const syncBox = document.getElementById('sync-animation-box');
        syncBox.classList.remove('merged');
        
        const iconB64 = db.stages[state.stage].icon;
        const bgStyle = iconB64 ? `background-image: url(${iconB64});` : `background: var(--theme-primary);`;
        
        if (role === 'boy') syncBox.innerHTML = `<div class="sync-half boy" style="${bgStyle} background-size: cover;"></div>`;
        else syncBox.innerHTML = `<div class="sync-half girl" style="${bgStyle} background-size: cover;"></div>`;
        
        navigateTo('screen-sync');
    }

    function triggerSync() {
        const syncBox = document.getElementById('sync-animation-box');
        syncBox.classList.add('merged');
        state.currentStep = 0;

        if(state.currentCard.bgm) {
            audioPlayer.src = state.currentCard.bgm;
            audioPlayer.play().then(() => {
                document.getElementById('apple-music-box').classList.add('playing');
            }).catch(e => console.log("需用户进一步交互才能播放", e));
        }

        setTimeout(() => { renderContentStep(); navigateTo('screen-content'); }, 1500);
    }

    function renderContentStep() {
        const stepData = state.currentCard.steps[state.currentStep];
        document.getElementById('content-type-title').innerText = `【${state.currentCard.type}】的连接`;
        document.getElementById('step-title').innerText = stepData.title;
        document.getElementById('step-text').innerHTML = stepData.text.replace(/\n/g, '<br><br>');

        for(let i=1; i<=3; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (i - 1 === state.currentStep) dot.classList.add('active');
            else dot.classList.remove('active');
        }

        const nextBtn = document.getElementById('btn-next-step');
        const longPressBtn = document.getElementById('btn-long-press');

        if (state.currentStep < 2) { nextBtn.style.display = 'flex'; longPressBtn.style.display = 'none'; } 
        else { nextBtn.style.display = 'none'; longPressBtn.style.display = 'flex'; }
    }

    function nextContentStep() {
        if (state.currentStep < 2) {
            state.currentStep++;
            const stepTitle = document.getElementById('step-title');
            const stepText = document.getElementById('step-text');
            stepTitle.style.opacity = 0; stepText.style.opacity = 0;
            setTimeout(() => {
                renderContentStep();
                stepTitle.style.transition = 'opacity 0.5s'; stepText.style.transition = 'opacity 0.5s';
                stepTitle.style.opacity = 1; stepText.style.opacity = 1;
            }, 300);
        }
    }

    /* ================= 9. 长按同心宣告 ================= */
    const longPressBtn = document.getElementById('btn-long-press');
    const pressFill = document.getElementById('press-fill');
    let progress = 0; let pressAnimationFrame = null; let isPressing = false;

    function startPress(e) {
        if(e.type === 'touchstart') e.preventDefault(); 
        if(isPressing) return;
        isPressing = true; progress = 0; cancelAnimationFrame(pressAnimationFrame);
        
        function updateProgress() {
            if(!isPressing) return;
            progress += (100 / 90); 
            pressFill.style.height = `${Math.min(progress, 100)}%`;
            if (progress >= 100) { isPressing = false; completeAction(); } 
            else pressAnimationFrame = requestAnimationFrame(updateProgress);
        }
        pressAnimationFrame = requestAnimationFrame(updateProgress);
    }

    function endPress(e) {
        if(e.type === 'touchend') e.preventDefault();
        isPressing = false; cancelAnimationFrame(pressAnimationFrame);
        if (progress < 100) { progress = 0; pressFill.style.height = `0%`; }
    }

    function completeAction() {
        cancelAnimationFrame(pressAnimationFrame); navigateTo('screen-finish');
    }

    longPressBtn.addEventListener('mousedown', startPress); longPressBtn.addEventListener('mouseup', endPress); longPressBtn.addEventListener('mouseleave', endPress);
    longPressBtn.addEventListener('touchstart', startPress, {passive: false}); longPressBtn.addEventListener('touchend', endPress, {passive: false}); longPressBtn.addEventListener('touchcancel', endPress, {passive: false});

    function resetToStage() {
        document.getElementById('apple-music-box').classList.remove('playing');
        audioPlayer.pause(); audioPlayer.currentTime = 0;
        pressFill.style.height = `0%`; state.currentCard = null; state.role = ''; state.currentStep = 0;
        initStageScreen();
    }

</script>
</body>
</html>
